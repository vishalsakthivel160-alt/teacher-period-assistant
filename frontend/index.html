    /* =========================================================================
       TEACHER APPLY LEAVE MANAGER
       ========================================================================= */
    function TeacherApplyLeaveManager({ token, pushToast, periods, onLeaveSubmitted }) {
      const [fromDate, setFromDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [toDate, setToDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [type, setType] = useState('full_day');
      const [periodId, setPeriodId] = useState('');
      const [reason, setReason] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [error, setError] = useState('');

      async function handleSubmit(e) {
        e.preventDefault();
        setError('');

        if (!fromDate || !toDate) {
          setError('From Date and To Date are required.');
          return;
        }
        if (fromDate > toDate) {
          setError('From Date cannot be later than To Date.');
          return;
        }
        if (type === 'specific_period' && !periodId) {
          setError('Please select a specific period.');
          return;
        }
        if (!reason.trim()) {
          setError('Please enter a reason for your leave.');
          return;
        }

        setIsSubmitting(true);
        try {
          const res = await fetch(getApiUrl('/api/teacher/leaves'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ fromDate, toDate, type, periodId, reason: reason.trim() })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            pushToast({ type: 'success', title: 'Leave Submitted', message: 'Leave application submitted successfully for Admin approval.' });
            setReason('');
            if (onLeaveSubmitted) onLeaveSubmitted();
          } else {
            setError(data.error || 'Failed to submit leave application.');
          }
        } catch (err) {
          setError('Connection error submitting leave.');
        } finally {
          setIsSubmitting(false);
        }
      }

      return (
        <SectionCard title="Apply for Faculty Leave" subtitle="Submit a leave application for Admin review and approval.">
          <form onSubmit={handleSubmit} className="max-w-2xl space-y-4 text-sm">
            {error && (
              <div className="p-3.5 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800 font-medium">
                {error}
              </div>
            )}

            <div className="grid sm:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">From Date *</label>
                <input
                  type="date"
                  value={fromDate}
                  onChange={e => setFromDate(e.target.value)}
                  className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none font-medium"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">To Date *</label>
                <input
                  type="date"
                  value={toDate}
                  onChange={e => setToDate(e.target.value)}
                  className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none font-medium"
                  required
                />
              </div>
            </div>

            <div>
              <label className="block text-xs font-semibold text-slate-600 mb-1">Leave Duration Type *</label>
              <div className="flex gap-4">
                <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700 bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-200">
                  <input
                    type="radio"
                    name="leaveType"
                    value="full_day"
                    checked={type === 'full_day'}
                    onChange={() => setType('full_day')}
                    className="accent-brand-600"
                  />
                  Full Day Leave
                </label>
                <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700 bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-200">
                  <input
                    type="radio"
                    name="leaveType"
                    value="specific_period"
                    checked={type === 'specific_period'}
                    onChange={() => setType('specific_period')}
                    className="accent-brand-600"
                  />
                  Specific Period Leave
                </label>
              </div>
            </div>

            {type === 'specific_period' && (
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Select Affected Period *</label>
                <select
                  value={periodId}
                  onChange={e => setPeriodId(e.target.value)}
                  className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none font-medium"
                  required
                >
                  <option value="">-- Select Period --</option>
                  {(periods || []).map(p => (
                    <option key={p.id} value={p.id}>{p.label} ({p.start} - {p.end})</option>
                  ))}
                </select>
              </div>
            )}

            <div>
              <label className="block text-xs font-semibold text-slate-600 mb-1">Reason for Leave *</label>
              <textarea
                rows="3"
                value={reason}
                onChange={e => setReason(e.target.value)}
                placeholder="Explain the reason for your leave application..."
                className="w-full border border-slate-300 rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none font-medium"
                required
              ></textarea>
            </div>

            <div className="pt-2">
              <PrimaryButton type="submit" icon="check" disabled={isSubmitting} className="py-2.5 px-6 font-bold">
                {isSubmitting ? 'Submitting Leave...' : 'Submit Leave Application'}
              </PrimaryButton>
            </div>
          </form>
        </SectionCard>
      );
    }

    /* =========================================================================
       TEACHER MY LEAVES MANAGER
       ========================================================================= */
    function TeacherMyLeavesManager({ token, pushToast }) {
      const [leaves, setLeaves] = useState([]);
      const [isLoading, setIsLoading] = useState(true);

      const fetchMyLeaves = async () => {
        setIsLoading(true);
        try {
          const res = await fetch(getApiUrl('/api/teacher/leaves'), {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setLeaves(data.leaves || []);
          }
        } catch (e) {
          console.error('[Fetch My Leaves Error]', e);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchMyLeaves();
      }, [token]);

      async function handleCancel(leaveId) {
        try {
          const res = await fetch(getApiUrl(`/api/teacher/leaves/${leaveId}`), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            pushToast({ type: 'reminder', title: 'Leave Cancelled', message: 'Leave request cancelled.' });
            fetchMyLeaves();
          } else {
            pushToast({ type: 'rose', title: 'Error', message: data.error || 'Failed to cancel leave.' });
          }
        } catch (err) {
          pushToast({ type: 'rose', title: 'Error', message: 'Connection error cancelling leave.' });
        }
      }

      const statusTones = { Pending: 'amber', Approved: 'green', Rejected: 'rose', Cancelled: 'slate' };

      return (
        <SectionCard title="My Leave Applications" subtitle="Track the status of your submitted leave requests.">
          {isLoading ? (
            <div className="py-8 text-center">
              <div className="w-8 h-8 border-4 border-brand-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
              <p className="text-xs text-slate-500">Loading leave requests...</p>
            </div>
          ) : leaves.length === 0 ? (
            <div className="text-center py-10 text-slate-400 text-xs italic border border-dashed border-slate-200 rounded-2xl">
              You have not submitted any leave applications yet.
            </div>
          ) : (
            <div className="space-y-3">
              {leaves.map(leave => (
                <div key={leave.id} className="p-4 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="font-extrabold text-slate-900 text-sm">Leave Application #{leave.id.slice(-6)}</span>
                    <Badge tone={statusTones[leave.status] || 'slate'}>{leave.status}</Badge>
                  </div>

                  <div className="grid sm:grid-cols-3 gap-2 text-xs">
                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                      <span className="text-[10px] uppercase font-bold text-slate-400">Date Range</span>
                      <p className="font-bold text-slate-800 mt-0.5">{leave.fromDate} to {leave.toDate}</p>
                    </div>
                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                      <span className="text-[10px] uppercase font-bold text-slate-400">Type</span>
                      <p className="font-bold text-brand-700 mt-0.5">
                        {leave.type === 'specific_period' ? `Specific Period (${leave.periodId || ''})` : 'Full Day'}
                      </p>
                    </div>
                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                      <span className="text-[10px] uppercase font-bold text-slate-400">Applied On</span>
                      <p className="font-semibold text-slate-700 mt-0.5">{new Date(leave.createdAt).toLocaleDateString()}</p>
                    </div>
                  </div>

                  {leave.reason && (
                    <div className="text-xs text-slate-700 bg-amber-50/50 p-3 rounded-xl border border-amber-100">
                      <span className="font-bold text-amber-900">Reason: </span>
                      <span>{leave.reason}</span>
                    </div>
                  )}

                  {leave.status === 'Pending' && (
                    <div className="flex justify-end pt-1">
                      <GhostButton onClick={() => handleCancel(leave.id)} className="py-1 px-3 text-xs text-rose-600 hover:bg-rose-50">
                        Cancel Leave Application
                      </GhostButton>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </SectionCard>
      );
    }

    /* =========================================================================
       TEACHER SUBSTITUTIONS VIEW MANAGER
       ========================================================================= */
    function TeacherSubstitutionsViewManager({ token, teacherId }) {
      const [subData, setSubData] = useState({ today: [], upcoming: [], history: [] });
      const [isLoading, setIsLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('today');

      const fetchSubstitutions = async () => {
        setIsLoading(true);
        try {
          const res = await fetch(getApiUrl('/api/teacher/substitutions'), {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setSubData({
              today: data.today || [],
              upcoming: data.upcoming || [],
              history: data.history || []
            });
          }
        } catch (e) {
          console.error('[Fetch Teacher Substitutions Error]', e);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchSubstitutions();
      }, [token]);

      const currentList = subData[activeTab] || [];

      return (
        <SectionCard title="Teacher Substitutions" subtitle="View assigned temporary class substitutions and coverage history.">
          <div className="space-y-4">
            <div className="flex border-b border-slate-200 gap-4 text-xs font-bold">
              {[
                { id: 'today', label: `Today's Substitutions (${subData.today.length})` },
                { id: 'upcoming', label: `Upcoming Substitutions (${subData.upcoming.length})` },
                { id: 'history', label: `Substitution History (${subData.history.length})` }
              ].map(tb => (
                <button
                  key={tb.id}
                  onClick={() => setActiveTab(tb.id)}
                  className={`pb-2.5 border-b-2 transition ${activeTab === tb.id ? 'border-brand-600 text-brand-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                >
                  {tb.label}
                </button>
              ))}
            </div>

            {isLoading ? (
              <div className="py-8 text-center">
                <div className="w-8 h-8 border-4 border-brand-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                <p className="text-xs text-slate-500">Loading substitutions...</p>
              </div>
            ) : currentList.length === 0 ? (
              <div className="text-center py-10 text-slate-400 text-xs italic border border-dashed border-slate-200 rounded-2xl">
                No substitutions listed for this category.
              </div>
            ) : (
              <div className="grid sm:grid-cols-2 gap-4">
                {currentList.map(sub => {
                  const isSubstitute = sub.substituteTeacherId === teacherId;
                  return (
                    <div key={sub.id} className="p-4 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-2.5 hover:border-brand-300 transition">
                      <div className="flex items-center justify-between">
                        <span className={`px-2.5 py-0.5 rounded-full font-bold text-xs ${isSubstitute ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>

                        <span className="text-xs font-mono font-bold text-slate-700">{sub.date}</span>
                      </div>

                      <div>
                        <h4 className="font-extrabold text-slate-900 text-base">{sub.subjectName}</h4>
                        <p className="text-xs font-bold text-brand-600 mt-0.5">{sub.className} {sub.roomName ? `(Room: ${sub.roomName})` : ''}</p>
                      </div>

                      <div className="p-2.5 bg-slate-50 rounded-xl text-xs space-y-1 font-mono">

    /* Faculty Tutor Student Manager Component */
    function TeacherTutorManager({ token, pushToast, teacherCode }) {
      const [tutorClasses, setTutorClasses] = useState([]);
      const [selectedClassId, setSelectedClassId] = useState('');
      const [students, setStudents] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');

      const [showModal, setShowModal] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);
      const [name, setName] = useState('');
      const [registerNumber, setRegisterNumber] = useState('');
      const [year, setYear] = useState('1st Year');
      const [isSubmitting, setIsSubmitting] = useState(false);

      useEffect(() => {
        fetchTutorClasses();
      }, [token]);

      async function fetchTutorClasses() {
        setIsLoading(true);
        try {
          const res = await fetch(getApiUrl('/api/teacher/tutor-classes'), {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            const classes = data.classes || [];
            setTutorClasses(classes);
            if (classes.length > 0) {
              setSelectedClassId(classes[0].id);
            }
          }
        } catch (e) {
          pushToast({ type: 'rose', title: 'Error', message: e.message });
        } finally {
          setIsLoading(false);
        }
      }

      useEffect(() => {
        if (selectedClassId) {
          fetchStudents(selectedClassId);
        }
      }, [selectedClassId, token]);

      async function fetchStudents(classId) {
        setIsLoading(true);
        try {
          const res = await fetch(getApiUrl(`/api/teacher/students?classId=${classId}`), {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setStudents(data.students || []);
          }
        } catch (e) {
          pushToast({ type: 'rose', title: 'Error', message: e.message });
        } finally {
          setIsLoading(false);
        }
      }

      function handleOpenAdd() {
        setEditingStudent(null);
        setName('');
        setRegisterNumber('');
        setYear('1st Year');
        setShowModal(true);
      }

      function handleOpenEdit(st) {
        setEditingStudent(st);
        setName(st.name || '');
        setRegisterNumber(st.registerNumber || '');
        setYear(st.year || '1st Year');
        setShowModal(true);
      }

      async function handleSaveStudent(e) {
        e.preventDefault();
        if (!name.trim() || !registerNumber.trim() || !selectedClassId) return;

        setIsSubmitting(true);
        try {
          const url = editingStudent
            ? getApiUrl(`/api/teacher/students/${editingStudent.id}`)
            : getApiUrl('/api/teacher/students');
          const method = editingStudent ? 'PUT' : 'POST';

          const res = await fetch(url, {
            method,
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({
              name: name.trim(),
              registerNumber: registerNumber.trim(),
              classId: selectedClassId,
              year
            })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            pushToast({ type: 'success', title: editingStudent ? 'Student Updated' : 'Student Added', message: `${name} saved.` });
            setShowModal(false);
            fetchStudents(selectedClassId);
          } else {
            pushToast({ type: 'rose', title: 'Error', message: data.error || 'Failed to save student.' });
          }
        } catch (e) {
          pushToast({ type: 'rose', title: 'Error', message: e.message });
        } finally {
          setIsSubmitting(false);
        }
      }

      async function handleDeleteStudent(stId) {
        if (!confirm('Are you sure you want to delete this student?')) return;
        try {
          const res = await fetch(getApiUrl(`/api/teacher/students/${stId}`), {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            pushToast({ type: 'reminder', title: 'Student Removed', message: 'Student deleted.' });
            fetchStudents(selectedClassId);
          }
        } catch (e) {
          pushToast({ type: 'rose', title: 'Error', message: e.message });
        }
      }

      const filteredStudents = students.filter(st => {
        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase();
        return (st.name || '').toLowerCase().includes(q) || (st.registerNumber || '').toLowerCase().includes(q);
      });

      const selectedClass = tutorClasses.find(c => c.id === selectedClassId);

      return (
        <SectionCard title="My Tutor Classes & Student Roster" subtitle="Manage students in your assigned tutor classes. Register Numbers are used for Student Portal Login.">
          {tutorClasses.length === 0 ? (
            <div className="text-center py-10 text-slate-400 text-xs italic border border-dashed border-slate-200 rounded-2xl space-y-2">
              <p className="font-bold text-slate-600">No Tutor Classes Assigned</p>
              <p>You have not been assigned as a Tutor for any class by the Administrator yet.</p>
            </div>
          ) : (
            <div className="space-y-6">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Select Assigned Tutor Class:</label>
                  <select
                    value={selectedClassId}
                    onChange={e => setSelectedClassId(e.target.value)}
                    className="border border-slate-300 rounded-xl px-3 py-2 text-sm font-extrabold text-brand-700 bg-white outline-none focus:ring-2 focus:ring-brand-500"
                  >
                    {tutorClasses.map(c => (
                      <option key={c.id} value={c.id}>{c.name} (Code: {c.id})</option>
                    ))}
                  </select>
                </div>

                <div className="flex items-center gap-2">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="Search by name or reg no..."
                    className="border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium bg-white focus:ring-2 focus:ring-brand-500 outline-none"
                  />
                  <PrimaryButton icon="plus" onClick={handleOpenAdd} className="whitespace-nowrap py-2 text-xs font-bold">
                    + Add Student
                  </PrimaryButton>
                </div>
              </div>

              {isLoading ? (
                <div className="py-8 text-center">
                  <div className="w-8 h-8 border-4 border-brand-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                  <p className="text-xs text-slate-500">Loading student roster...</p>
                </div>
              ) : filteredStudents.length === 0 ? (
                <div className="text-center py-10 text-slate-400 text-xs italic border border-dashed border-slate-200 rounded-2xl">
                  No students registered for {selectedClass ? selectedClass.name : 'this class'} yet.
                </div>
              ) : (
                <div className="overflow-x-auto rounded-2xl border border-slate-200">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 text-slate-600 font-bold uppercase tracking-wider border-b border-slate-200">
                      <tr>
                        <th className="p-3">#</th>
                        <th className="p-3">Student Name</th>
                        <th className="p-3">Register Number</th>
                        <th className="p-3">Year</th>
                        <th className="p-3 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-medium">
                      {filteredStudents.map((st, idx) => (
                        <tr key={st.id} className="hover:bg-slate-50">
                          <td className="p-3 text-slate-400 font-mono">{idx + 1}</td>
                          <td className="p-3 font-bold text-slate-900">{st.name}</td>
                          <td className="p-3 font-mono font-bold text-brand-700">{st.registerNumber}</td>
                          <td className="p-3 text-slate-600">{st.year || '1st Year'}</td>
                          <td className="p-3 text-right space-x-1">
                            <GhostButton onClick={() => handleOpenEdit(st)} className="py-1 px-2 text-xs">Edit</GhostButton>
                            <GhostButton onClick={() => handleDeleteStudent(st.id)} className="py-1 px-2 text-xs text-rose-600 hover:bg-rose-50">Delete</GhostButton>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          <Modal open={showModal} onClose={() => setShowModal(false)} title={editingStudent ? 'Edit Student Details' : 'Add New Student to Class Roster'}>
            <form onSubmit={handleSaveStudent} className="space-y-4 text-sm">
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Student Full Name *</label>
                <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Keerthana R" className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none font-bold" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Register Number (Login Credential) *</label>
                <input type="text" value={registerNumber} onChange={e => setRegisterNumber(e.target.value.replace(/\D/g, ''))} placeholder="e.g. 920321" className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-mono text-xl tracking-wider text-center font-bold focus:ring-2 focus:ring-brand-500 outline-none" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Academic Year</label>
                <select value={year} onChange={e => setYear(e.target.value)} className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-bold bg-white focus:ring-2 focus:ring-brand-500 outline-none">
                  <option value="1st Year">1st Year</option>
                  <option value="2nd Year">2nd Year</option>
                  <option value="3rd Year">3rd Year</option>
                  <option value="4th Year">4th Year</option>
                </select>
              </div>
              <div className="flex justify-end gap-2 pt-2 border-t border-slate-200">
                <GhostButton onClick={() => setShowModal(false)}>Cancel</GhostButton>
                <PrimaryButton type="submit" disabled={isSubmitting}>
                  {isSubmitting ? 'Saving...' : 'Save Student'}
                </PrimaryButton>
              </div>
            </form>
          </Modal>
        </SectionCard>
      );
    }

    /* Faculty Period Attendance Manager Component */
    function TeacherAttendanceManager({ token, pushToast, timetableData }) {
      const [classes, setClasses] = useState([]);
      const [subjects, setSubjects] = useState([]);

      const [date, setDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [selectedClassId, setSelectedClassId] = useState('');
      const [selectedSubjectId, setSelectedSubjectId] = useState('');
      const [selectedPeriodId, setSelectedPeriodId] = useState('p1');

      const [students, setStudents] = useState([]);
      const [attendanceMap, setAttendanceMap] = useState({});
      const [isLoading, setIsLoading] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      useEffect(() => {
        fetchMetadata();
      }, [token]);

      async function fetchMetadata() {
        try {
          const resCls = await fetch(getApiUrl('/api/teacher/classes'), {
            headers: { Authorization: `Bearer ${token}` }
          });
          const dataCls = await resCls.json();
          if (dataCls.success) {
            if (dataCls.classes && dataCls.classes.length > 0) {
              setClasses(dataCls.classes);
              setSelectedClassId(dataCls.classes[0].id);
            }
            if (dataCls.subjects && dataCls.subjects.length > 0) {
              setSubjects(dataCls.subjects);
              setSelectedSubjectId(dataCls.subjects[0].id);
            }
          }
        } catch (e) {}
      }

      useEffect(() => {
        if (selectedClassId) {
          fetchClassData();
        }
      }, [selectedClassId, date, selectedPeriodId, token]);

      async function fetchClassData() {
        setIsLoading(true);
        try {
          const resSt = await fetch(getApiUrl(`/api/teacher/students?classId=${selectedClassId}`), {
            headers: { Authorization: `Bearer ${token}` }
          });
          const dataSt = await resSt.json();
          const stList = dataSt.students || [];
          setStudents(stList);

          const initMap = {};
          stList.forEach(st => { initMap[st.id] = 'present'; });

          const resAtt = await fetch(getApiUrl(`/api/teacher/attendance?classId=${selectedClassId}&date=${date}&periodId=${selectedPeriodId}`), {
            headers: { Authorization: `Bearer ${token}` }
          });
          const dataAtt = await resAtt.json();
          if (dataAtt.success && dataAtt.records && dataAtt.records.length > 0) {
            dataAtt.records.forEach(r => {
              initMap[r.studentId] = r.status;
            });
            if (dataAtt.subjectId) setSelectedSubjectId(dataAtt.subjectId);
          }

          setAttendanceMap(initMap);
        } catch (e) {
          pushToast({ type: 'rose', title: 'Error', message: e.message });
        } finally {
          setIsLoading(false);
        }
      }

      function setAllStatus(status) {
        const updated = {};
        students.forEach(st => { updated[st.id] = status; });
        setAttendanceMap(updated);
      }

      async function handleSaveAttendance() {
        if (!selectedClassId || students.length === 0) {
          pushToast({ type: 'rose', title: 'No Students', message: 'No students found in selected class.' });
          return;
        }

        setIsSaving(true);
        try {
          const records = students.map(st => ({
            studentId: st.id,
            registerNumber: st.registerNumber,
            studentName: st.name,
            status: attendanceMap[st.id] || 'present'
          }));

          const res = await fetch(getApiUrl('/api/teacher/attendance'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({
              classId: selectedClassId,
              subjectId: selectedSubjectId || 's_gen',
              date,
              periodId: selectedPeriodId,
              records
            })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            pushToast({ type: 'success', title: 'Attendance Saved!', message: `Period attendance recorded for ${students.length} students.` });
          } else {
            pushToast({ type: 'rose', title: 'Save Failed', message: data.error || 'Failed to save attendance.' });
          }
        } catch (e) {
          pushToast({ type: 'rose', title: 'Error', message: e.message });
        } finally {
          setIsSaving(false);
        }
      }

      const activeClassSubjects = subjects.filter(s => !selectedClassId || !s.classId || s.classId === selectedClassId);
      const selectedClassObj = classes.find(c => c.id === selectedClassId);

      return (
        <SectionCard title="Take Period-Wise Student Attendance" subtitle="Select Class, Subject, Date and Period to record student attendance for your assigned periods.">
          <div className="space-y-6">
            <div className="grid grid-cols-1 sm:grid-cols-5 gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Date:</label>
                <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold bg-white focus:ring-2 focus:ring-brand-500 outline-none" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Class *:</label>
                <select value={selectedClassId} onChange={e => setSelectedClassId(e.target.value)} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs font-extrabold text-brand-700 bg-white focus:ring-2 focus:ring-brand-500 outline-none">
                  {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Subject *:</label>
                <select value={selectedSubjectId} onChange={e => setSelectedSubjectId(e.target.value)} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold bg-white focus:ring-2 focus:ring-brand-500 outline-none">
                  {activeClassSubjects.length === 0 ? (
                    <option value="s_gen">General Subject</option>
                  ) : (
                    activeClassSubjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)
                  )}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Period *:</label>
                <select value={selectedPeriodId} onChange={e => setSelectedPeriodId(e.target.value)} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold bg-white focus:ring-2 focus:ring-brand-500 outline-none">
                  {['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7'].map(p => (
                    <option key={p} value={p}>Period {p.slice(1)}</option>
                  ))}
                </select>
              </div>
              <div className="flex items-end">
                <PrimaryButton icon="check" onClick={handleSaveAttendance} disabled={isSaving || students.length === 0} className="w-full py-2.5 text-xs font-bold">

                <span>🏫 Loaded Class: <strong>{selectedClassObj.name}</strong> {selectedClassObj.tutorTeacherName ? `(Class Tutor: ${selectedClassObj.tutorTeacherName})` : ''}</span>
                <span className="font-mono text-brand-700">Roster Count: {students.length} Students</span>

            <div className="flex items-center justify-between">
              <h4 className="font-extrabold text-slate-900 text-sm">Class Roster ({students.length} Students)</h4>
              <div className="flex gap-2">
                <GhostButton onClick={() => setAllStatus('present')} className="py-1 px-3 text-xs font-bold text-emerald-700">Mark All Present</GhostButton>

              <div className="py-8 text-center">
                <div className="w-8 h-8 border-4 border-brand-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                <p className="text-xs text-slate-500">Loading student roster for selected class...</p>
              </div>
            ) : students.length === 0 ? (
              <div className="text-center py-10 text-slate-400 text-xs italic border border-dashed border-slate-200 rounded-2xl space-y-1">
                <p className="font-bold text-slate-600">No Students Found for {selectedClassObj ? selectedClassObj.name : 'Selected Class'}</p>
                <p className="text-slate-400">The Tutor ({selectedClassObj ? (selectedClassObj.tutorTeacherName || 'Class Tutor') : 'Tutor'}) needs to add students under 'My Tutor Classes & Students'.</p>

                      <div className="flex items-center gap-3">
                        <span className="w-6 h-6 rounded-full bg-slate-100 text-slate-600 font-mono text-xs font-bold flex items-center justify-center">{idx + 1}</span>
                        <div>
                          <p className="font-bold text-slate-900 text-sm">{st.name}</p>
                          <p className="text-xs font-mono text-brand-700 font-bold">Reg No: {st.registerNumber}</p>
                        </div>
                      </div>

                      <div className="flex gap-2">
                        <button
                          type="button"
                          onClick={() => setAttendanceMap({ ...attendanceMap, [st.id]: 'present' })}
                          className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition border ${status === 'present' ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200'}`}
                        >
                          ✓ Present
                        </button>
                        <button
                          type="button"
                          onClick={() => setAttendanceMap({ ...attendanceMap, [st.id]: 'absent' })}
                          className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition border ${status === 'absent' ? 'bg-rose-600 text-white border-rose-600 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200'}`}
                        >
                          ✗ Absent
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </SectionCard>
      );
    }

    /* Faculty Assignments Manager Component */
    function TeacherAssignmentsManager({ token, pushToast }) {
      const [classes, setClasses] = useState([]);
      const [assignments, setAssignments] = useState([]);
      const [selectedClassId, setSelectedClassId] = useState('');
      const [isLoading, setIsLoading] = useState(true);

      const [showCreateModal, setShowCreateModal] = useState(false);
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');
      const [dueDate, setDueDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [isCreating, setIsCreating] = useState(false);

      useEffect(() => {
        fetchData();
      }, [token]);

      async function fetchData() {
        setIsLoading(true);
        try {
          const resCls = await fetch(getApiUrl('/api/teacher/tutor-classes'), {
            headers: { Authorization: `Bearer ${token}` }
          });
          const dataCls = await resCls.json();
          if (dataCls.success && dataCls.classes && dataCls.classes.length > 0) {
            setClasses(dataCls.classes);
            setSelectedClassId(dataCls.classes[0].id);
          }

          const resAsgn = await fetch(getApiUrl('/api/teacher/assignments'), {
            headers: { Authorization: `Bearer ${token}` }
          });
          const dataAsgn = await resAsgn.json();
          if (dataAsgn.success) {
            setAssignments(dataAsgn.assignments || []);
          }
        } catch (e) {
          pushToast({ type: 'rose', title: 'Error', message: e.message });
        } finally {
          setIsLoading(false);
        }
      }

      async function handleCreateAssignment(e) {
        e.preventDefault();
        if (!title.trim() || !selectedClassId) return;

        setIsCreating(true);
        try {
          const res = await fetch(getApiUrl('/api/teacher/assignments'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({
              classId: selectedClassId,
              subjectId: 's_gen',
              title: title.trim(),
              description: description.trim(),
              dueDate
            })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            pushToast({ type: 'success', title: 'Assignment Created', message: 'Assignment posted to class.' });
            setShowCreateModal(false);
            setTitle('');
            setDescription('');
            fetchData();
          } else {
            pushToast({ type: 'rose', title: 'Error', message: data.error || 'Failed to create assignment.' });
          }
        } catch (e) {
          pushToast({ type: 'rose', title: 'Error', message: e.message });
        } finally {
          setIsCreating(false);
        }
      }

      async function handleConfirmSubmission(asgnId, stId) {
        try {
          const res = await fetch(getApiUrl('/api/teacher/confirm-assignment'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ assignmentId: asgnId, studentId: stId })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            pushToast({ type: 'success', title: 'Confirmed! (Submitted ✓)', message: 'Student submission verified and ticked.' });
            fetchData();
          } else {
            pushToast({ type: 'rose', title: 'Error', message: data.error || 'Failed to confirm.' });
          }
        } catch (e) {
          pushToast({ type: 'rose', title: 'Error', message: e.message });
        }
      }

      return (
        <SectionCard title="Assignment Posting & Verification Manager" subtitle="Post assignments to classes and verify student submissions with a confirmation tick (Submitted ✓).">
          <div className="space-y-6">
            <div className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-200">
              <div>
                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Assignments Count: {assignments.length}</span>
              </div>
              <PrimaryButton icon="plus" onClick={() => setShowCreateModal(true)} className="py-2 text-xs font-bold">
                + Post New Assignment
              </PrimaryButton>
            </div>

            {isLoading ? (
              <div className="py-8 text-center">
                <div className="w-8 h-8 border-4 border-brand-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                <p className="text-xs text-slate-500">Loading assignments...</p>
              </div>
            ) : assignments.length === 0 ? (
              <div className="text-center py-10 text-slate-400 text-xs italic border border-dashed border-slate-200 rounded-2xl">
                No assignments posted yet.
              </div>
            ) : (
              <div className="space-y-4">
                {assignments.map(asgn => (
                  <div key={asgn.id} className="p-5 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-4">
                    <div className="flex flex-wrap justify-between items-start gap-2">
                      <div>
                        <span className="px-2.5 py-0.5 bg-brand-100 text-brand-800 text-[11px] font-bold rounded-md">{asgn.className}</span>
                        <h4 className="text-base font-black text-slate-900 mt-1">{asgn.title}</h4>
                        <p className="text-xs text-slate-500 font-medium">Due Date: {asgn.dueDate}</p>
                      </div>
                      <Badge tone="blue">{asgn.submissions ? asgn.submissions.length : 0} Submissions</Badge>
                    </div>

                    {asgn.description && (
                      <p className="text-xs text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-100">{asgn.description}</p>
                    )}

                    <div className="border-t border-slate-100 pt-3 space-y-2">
                      <h5 className="font-extrabold text-slate-800 text-xs uppercase tracking-wider">Student Submissions Verification List:</h5>

                      {(!asgn.submissions || asgn.submissions.length === 0) ? (
                        <p className="text-xs text-slate-400 italic">No student submissions recorded yet.</p>
                      ) : (
                        <div className="space-y-2">
                          {asgn.submissions.map((sub, idx) => (
                            <div key={idx} className="p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between gap-3 text-xs">
                              <div>
                                <p className="font-bold text-slate-900">{sub.studentName} <span className="font-mono text-brand-700 font-bold">({sub.registerNumber})</span></p>
                                <p className="text-[11px] text-slate-600 font-mono mt-0.5">{sub.submissionText}</p>
                              </div>

                              <div>
                                {sub.status === 'Submitted ✓' ? (
                                  <span className="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full font-extrabold text-xs border border-emerald-300">
                                    Submitted ✓ Verified
                                  </span>
                                ) : (
                                  <button
                                    type="button"
                                    onClick={() => handleConfirmSubmission(asgn.id, sub.studentId)}
                                    className="px-3 py-1 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-extrabold text-xs transition shadow-sm"
                                  >
                                    ✓ Tick & Verify Submission
                                  </button>
                                )}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <Modal open={showCreateModal} onClose={() => setShowCreateModal(false)} title="Post New Assignment">
            <form onSubmit={handleCreateAssignment} className="space-y-4 text-sm">
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Target Class *</label>
                <select value={selectedClassId} onChange={e => setSelectedClassId(e.target.value)} className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm font-bold bg-white focus:ring-2 focus:ring-brand-500 outline-none">
                  {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Assignment Title *</label>
                <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. Unit 1 Math Exercises" className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Instructions / Description</label>
                <textarea rows="3" value={description} onChange={e => setDescription(e.target.value)} placeholder="Enter details..." className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-medium focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Due Date *</label>
                <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none" required />
              </div>
              <div className="flex justify-end gap-2 pt-2 border-t border-slate-200">
                <GhostButton onClick={() => setShowCreateModal(false)}>Cancel</GhostButton>
                <PrimaryButton type="submit" disabled={isCreating}>
                  {isCreating ? 'Posting...' : 'Post Assignment'}
                </PrimaryButton>
              </div>
            </form>
          </Modal>
        </SectionCard>
      );
    }

    /* =========================================================================
       TEACHER DASHBOARD & PERSONAL TIMETABLE (Read-Only Isolated Faculty Portal)
       ========================================================================= */
    function TeacherDashboard() {
      const { session, logout, now, pushToast, token } = useApp();
      const [activeTab, setActiveTab] = useState('home');
      const [timetableData, setTimetableData] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [announcements, setAnnouncements] = useState([]);
      const [isLoadingAnnouncements, setIsLoadingAnnouncements] = useState(false);
      const [announcementsDepts, setAnnouncementsDepts] = useState([]);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      const fetchTeacherData = async () => {
        if (!token) return;
        try {
          const res = await fetch(getApiUrl('/api/auth/teacher/timetable'), {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setTimetableData(data);
          }
        } catch (e) {
          console.error('[Teacher Fetch Error]', e);
        }
        setIsLoading(false);
      };

      const fetchTeacherAnnouncements = async () => {
        if (!token) return;
        setIsLoadingAnnouncements(true);
        try {
          const res = await fetch(getApiUrl('/api/auth/teacher/announcements'), {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setAnnouncements(data.announcements || []);
            setAnnouncementsDepts(data.departments || []);
          }
        } catch (e) {
          console.error('[Teacher Announcements Fetch Error]', e);
        } finally {
          setIsLoadingAnnouncements(false);
        }
      };

      useEffect(() => {
        fetchTeacherData();
        fetchTeacherAnnouncements();
      }, [token]);

      if (isLoading || !timetableData) {
        return (
          <div className="max-w-7xl mx-auto px-4 py-12 text-center">
            <div className="w-10 h-10 border-4 border-brand-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
            <p className="text-sm font-medium text-slate-600">Loading Teacher Timetable & Portal...</p>
          </div>
        );
      }

      const { teacher, institution, timetable } = timetableData;
      const DAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
      const currentDayKey = DAY_KEYS[now.getDay()];
      const todayClasses = timetable[currentDayKey] || [];
      const currentDateStr = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      let activeClass = null;
      let nextClass = null;

      todayClasses.forEach(item => {
        if (!item.startTime) return;
        const [sh, sm] = item.startTime.split(':').map(Number);
        const [eh, em] = (item.endTime || '23:59').split(':').map(Number);
        const startM = sh * 60 + sm;
        const endM = eh * 60 + em;

        if (currentMinutes >= startM && currentMinutes < endM) {
          activeClass = item;
        } else if (currentMinutes < startM && (!nextClass || startM < nextClass.startM)) {
          nextClass = { ...item, startM };
        }
      });

      const MENU_ITEMS = [
        { id: 'home', label: "Today's Schedule", icon: 'home' },
        { id: 'tutor', label: 'My Tutor Classes & Students', icon: 'user' },
        { id: 'attendance', label: 'Take Period Attendance', icon: 'check' },
        { id: 'assignments', label: 'Assignment Verification', icon: 'layers' },
        { id: 'weekly', label: 'My Timetable (Weekly)', icon: 'calendar' },
        { id: 'apply-leave', label: 'Apply Leave', icon: 'plus' },
        { id: 'my-leaves', label: 'My Leaves', icon: 'calendar' },
        { id: 'substitutions', label: 'Substitutions', icon: 'users' },
        { id: 'announcements', label: 'Announcements', icon: 'bell' },
        { id: 'notifications', label: 'Mobile Device & Push', icon: 'mobile' },
        { id: 'profile', label: 'Profile Details', icon: 'user' }
      ];

      const activeMenuItem = MENU_ITEMS.find(m => m.id === activeTab) || MENU_ITEMS[0];

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-50">
          {/* MOBILE TOP HEADER & VERTICAL COLLAPSIBLE MENU DRAWER (Mobile < 768px) */}
          <div className="md:hidden bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-lg no-print">
            <div className="flex items-center justify-between p-4">
              <div className="flex items-center gap-3">
                <button
                  type="button"
                  onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                  className="w-10 h-10 rounded-xl bg-brand-600 hover:bg-brand-500 flex items-center justify-center text-white text-lg font-bold shadow-md transition active:scale-95 shrink-0"
                  aria-label="Toggle Navigation Menu"
                >
                  {isMobileMenuOpen ? '✕' : '☰'}
                </button>
                <div className="min-w-0">
                  <span className="text-[10px] font-extrabold uppercase tracking-wider text-brand-300 block">Faculty Portal Menu</span>
                  <span className="font-extrabold text-sm text-white flex items-center gap-1.5 truncate">
                    <Icon name={activeMenuItem.icon} size={14} className="text-brand-400 shrink-0" />
                    <span className="truncate">{activeMenuItem.label}</span>
                  </span>
                </div>
              </div>

              <span className="px-2.5 py-1 bg-amber-400 text-slate-950 rounded-full text-[10px] font-mono font-bold shrink-0">
                Code: {teacher.teacherCode}
              </span>
            </div>

            {/* Mobile Vertical Menu Items Stack (Displayed 1 below another) */}
            {isMobileMenuOpen && (
              <div className="border-t border-slate-800 bg-slate-950 p-3 space-y-1.5 max-h-[80vh] overflow-y-auto">
                <p className="px-3 py-1 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Vertical Faculty Menu</p>
                {MENU_ITEMS.map(item => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => {
                        setActiveTab(item.id);
                        setIsMobileMenuOpen(false);
                      }}
                      className={`w-full flex items-center justify-between px-4 py-3.5 rounded-2xl text-sm font-bold transition text-left ${isActive ? 'bg-brand-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}
                    >
                      <div className="flex items-center gap-3">
                        <span className={`w-8 h-8 rounded-xl flex items-center justify-center text-base ${isActive ? 'bg-white/20 text-white' : 'bg-slate-800 text-slate-400'}`}>
                          <Icon name={item.icon} size={18} />
                        </span>
                        <span className="text-sm font-bold">{item.label}</span>
                      </div>
                    </button>
                  );
                })}

                <div className="pt-2 border-t border-slate-800/80">
                  <button
                    type="button"
                    onClick={logout}
                    className="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-bold text-rose-400 hover:bg-rose-950/40 transition"
                  >
                    <Icon name="logout" size={16} /> Sign Out of Faculty Portal
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* DESKTOP PERMANENT LEFT SIDEBAR NAVIGATION (Desktop >= 768px) */}
          <aside className="hidden md:flex flex-col w-64 lg:w-72 bg-slate-900 text-slate-300 min-h-screen shrink-0 border-r border-slate-800 no-print sticky top-0 h-screen overflow-y-auto">
            <div className="p-5 border-b border-slate-800 space-y-2 bg-slate-950">
              <div className="flex items-center gap-2.5">
                <span className="w-9 h-9 rounded-xl bg-brand-600 text-white font-black flex items-center justify-center text-base shadow-md shrink-0">
                  👨‍🏫
                </span>
                <div>
                  <h1 className="font-extrabold text-sm text-white leading-tight">{teacher.name}</h1>
                  <span className="text-[10px] font-bold uppercase tracking-wider text-brand-400">Faculty Portal</span>
                </div>
              </div>
              <div className="p-2.5 bg-slate-900 border border-slate-800 rounded-xl space-y-0.5">
                <p className="text-[11px] font-bold text-slate-200 truncate">{institution.institution_name}</p>
                <p className="text-[10px] font-mono text-slate-400">Code: {teacher.teacherCode}</p>
              </div>
            </div>

            <nav className="flex-1 p-3.5 space-y-1.5">
              <p className="px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Vertical Navigation</p>
              {MENU_ITEMS.map(item => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center justify-between px-3.5 py-3 rounded-2xl text-xs font-bold transition text-left ${isActive ? 'bg-brand-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}
                  >
                    <div className="flex items-center gap-3">
                      <Icon name={item.icon} size={18} className={isActive ? 'text-white' : 'text-slate-400'} />
                      <span>{item.label}</span>
                    </div>
                  </button>
                );
              })}
            </nav>

            <div className="p-4 border-t border-slate-800 bg-slate-950">
              <button
                type="button"
                onClick={logout}
                className="w-full flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-slate-900 hover:bg-rose-950 text-rose-400 border border-slate-800 text-xs font-bold transition"

              pushToast={pushToast}
            />

    /* Student Dashboard Component */
    function StudentDashboard() {
      const { token, pushToast, logout } = useApp();
      const [data, setData] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');
      const [activeTab, setActiveTab] = useState('attendance');

      const [submittingId, setSubmittingId] = useState(null);
      const [submissionTextMap, setSubmissionTextMap] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);

      useEffect(() => {
        fetchStudentData();
      }, [token]);

      async function fetchStudentData() {
        setIsLoading(true);
        setErrorMsg('');
        try {
          const res = await fetch(getApiUrl('/api/student/my-data'), {
            headers: { Authorization: `Bearer ${token}` }
          });
          const resData = await res.json();
          if (!res.ok || !resData.success) {
            setErrorMsg(resData.error || 'Failed to fetch student profile data.');
            setIsLoading(false);
            return;
          }
          setData(resData);
        } catch (err) {
          setErrorMsg('Could not connect to server: ' + err.message);
        } finally {
          setIsLoading(false);
        }
      }

      async function handleSubmitAssignment(asgnId) {
        const text = (submissionTextMap[asgnId] || '').trim();
        if (!text) {
          pushToast({ type: 'rose', title: 'Empty Submission', message: 'Please enter submission notes or link before submitting.' });
          return;
        }

        setIsSubmitting(true);
        try {
          const res = await fetch(getApiUrl('/api/student/submit-assignment'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ assignmentId: asgnId, submissionText: text })
          });

          const resData = await res.json();
          if (res.ok && resData.success) {
            pushToast({ type: 'success', title: 'Assignment Submitted!', message: 'Your assignment has been submitted to your faculty.' });
            setSubmittingId(null);
            fetchStudentData();
          } else {
            pushToast({ type: 'rose', title: 'Submission Failed', message: resData.error || 'Failed to submit.' });
          }
        } catch (e) {
          pushToast({ type: 'rose', title: 'Error', message: e.message });
        } finally {
          setIsSubmitting(false);
        }
      }

      if (isLoading) {
        return (
          <div className="max-w-7xl mx-auto px-4 py-12 text-center">
            <div className="w-10 h-10 border-4 border-brand-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
            <p className="text-sm font-medium text-slate-600">Loading Student Portal...</p>
          </div>
        );
      }

      if (errorMsg || !data) {
        return (
          <div className="max-w-xl mx-auto px-4 py-12 text-center space-y-4">
            <div className="p-4 bg-rose-50 border border-rose-200 rounded-2xl text-xs text-rose-800 font-medium">
              {errorMsg || 'Student profile unavailable.'}
            </div>
            <GhostButton onClick={logout}>Sign Out</GhostButton>
          </div>
        );
      }

      const { student, institution, classInfo, attendance, assignments } = data;
      const { totalConducted, totalAttended, percentage, subjectBreakdown, logs } = attendance;

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
          {/* Header Banner */}
          <div className="bg-gradient-to-r from-brand-600 via-brand-700 to-brand-900 text-white rounded-3xl p-6 sm:p-8 shadow-xl relative overflow-hidden">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 relative z-10">
              <div className="space-y-2">
                <div className="inline-flex items-center gap-2 px-3 py-1 bg-white/10 backdrop-blur rounded-full text-xs font-bold text-brand-100 border border-white/20">
                  🎓 Student Portal • {institution.name} ({institution.code})
                </div>
                <h1 className="text-2xl sm:text-3xl font-black tracking-tight">{student.name}</h1>
                <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs text-brand-100 font-mono">
                  <span>Register No: <strong className="text-white select-all">{student.registerNumber}</strong></span>
                  <span>Class: <strong className="text-white">{student.className || (classInfo ? classInfo.name : 'N/A')}</strong></span>
                  <span>Tutor: <strong className="text-white">{classInfo ? classInfo.tutorName : 'Unassigned'}</strong></span>
                </div>
              </div>

              <div className="flex items-center gap-4 bg-white/10 backdrop-blur border border-white/20 p-4 rounded-2xl self-start md:self-auto">
                <div className="text-center">
                  <p className="text-[10px] uppercase tracking-wider text-brand-200 font-bold">Overall Attendance</p>
                  <p className={`text-3xl font-black ${percentage >= 75 ? 'text-emerald-400' : 'text-amber-300'}`}>
                    {percentage}%
                  </p>
                  <p className="text-[11px] text-brand-100 mt-0.5">{totalAttended} / {totalConducted} Periods</p>
                </div>
              </div>
            </div>
          </div>

          {/* Navigation Tabs */}

                          </div>

                          <div>
                            <span className={`px-3 py-1 rounded-full text-xs font-extrabold ${asgn.status === 'Submitted ✓' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : asgn.status === 'Submitted' ? 'bg-brand-100 text-brand-800 border border-brand-300' : 'bg-amber-100 text-amber-800 border border-amber-300'}`}>
                              {asgn.status}
                            </span>
                          </div>
                        </div>

                        {asgn.description && (
                          <p className="text-xs text-slate-700 bg-white p-3 rounded-xl border border-slate-200">{asgn.description}</p>
                        )}

                        {asgn.userSubmission ? (
                          <div className="p-3 bg-emerald-50/60 border border-emerald-200 rounded-xl text-xs space-y-1">
                            <p className="font-bold text-emerald-900">Your Submission:</p>
                            <p className="text-slate-800 font-mono">{asgn.userSubmission.submissionText}</p>
                            <p className="text-[10px] text-slate-500">Submitted at: {new Date(asgn.userSubmission.submittedAt).toLocaleString()}</p>
                          </div>
                        ) : (
                          <div className="pt-2 space-y-2">
                            {submittingId === asgn.id ? (
                              <div className="space-y-2">
                                <textarea
                                  rows="3"
                                  value={submissionTextMap[asgn.id] || ''}
                                  onChange={e => setSubmissionTextMap({ ...submissionTextMap, [asgn.id]: e.target.value })}
                                  placeholder="Type your submission details, completion notes, or link here..."
                                  className="w-full text-xs border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-brand-500 outline-none"
                                ></textarea>
                                <div className="flex gap-2 justify-end">
                                  <GhostButton onClick={() => setSubmittingId(null)}>Cancel</GhostButton>
                                  <PrimaryButton icon="check" onClick={() => handleSubmitAssignment(asgn.id)} disabled={isSubmitting}>
                                    {isSubmitting ? 'Submitting...' : 'Confirm Submission'}
                                  </PrimaryButton>
                                </div>
                              </div>
                            ) : (
                              <PrimaryButton icon="upload" onClick={() => setSubmittingId(asgn.id)}>
                                Submit Assignment
                              </PrimaryButton>
                            )}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* Main App Router */
    function MainApp() {
      const { session } = useApp();
      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          <Navbar />
          <ToastStack />
          <main className="flex-1">
            {!session ? (
              <AuthPortalScreen />
            ) : session.role === 'admin' ? (
              <AdminDashboard />
            ) : session.role === 'student' ? (
              <StudentDashboard />
            ) : (
              <TeacherDashboard />
            )}
          </main>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(
      <AppProvider>
        <MainApp />
      </AppProvider>
    );
  </script>
</body>

</html>
