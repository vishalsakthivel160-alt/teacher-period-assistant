    /* =========================================================================
       SEARCHABLE AUTOCOMPLETE SELECT (Single-Event Key Navigation for Subject & Staff)
       ========================================================================= */
    function SearchableSelect({ value, onChange, options = [], placeholder = '-- Select --', className = '' }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [highlightedIndex, setHighlightedIndex] = useState(0);
      const containerRef = useRef(null);
      const optionRefs = useRef([]);

      const selectedOption = options.find(o => o.id === value);

      useEffect(() => {
        function handleClickOutside(e) {
          if (containerRef.current && !containerRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        }
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const filteredOptions = useMemo(() => {
        if (!searchQuery.trim()) return options;
        const q = searchQuery.trim().toLowerCase();
        return options.filter(opt => (opt.name || '').toLowerCase().includes(q))
          .sort((a, b) => {
            const aStarts = (a.name || '').toLowerCase().startsWith(q);
            const bStarts = (b.name || '').toLowerCase().startsWith(q);
            if (aStarts && !bStarts) return -1;
            if (!aStarts && bStarts) return 1;
            return (a.name || '').localeCompare(b.name || '');
          });
      }, [options, searchQuery]);

      // Reset highlighted index to 0 whenever search query changes
      useEffect(() => {
        setHighlightedIndex(0);
      }, [searchQuery]);

      // Auto-scroll highlighted option into view
      useEffect(() => {
        if (isOpen && optionRefs.current[highlightedIndex]) {
          optionRefs.current[highlightedIndex].scrollIntoView({ block: 'nearest' });
        }
      }, [highlightedIndex, isOpen]);

      function handleSelectOption(opt) {
        if (!opt) return;
        onChange(opt.id);
        setIsOpen(false);
        setSearchQuery('');
      }

      function handleKeyDown(e) {
        if (!isOpen) {
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter') {
            e.preventDefault();
            e.stopPropagation();
            setIsOpen(true);
            setSearchQuery('');
            setHighlightedIndex(0);
          }
          return;
        }

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          e.stopPropagation();
          setHighlightedIndex(prev => (prev < filteredOptions.length - 1 ? prev + 1 : 0));
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          e.stopPropagation();
          setHighlightedIndex(prev => (prev > 0 ? prev - 1 : filteredOptions.length - 1));
        } else if (e.key === 'Enter') {
          e.preventDefault();
          e.stopPropagation();
          if (filteredOptions.length > 0) {
            const safeIdx = Math.min(Math.max(0, highlightedIndex), filteredOptions.length - 1);
            const selected = filteredOptions[safeIdx];
            if (selected) {
              handleSelectOption(selected);
            }
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          e.stopPropagation();
          setIsOpen(false);
        }
      }

      return (
        <div ref={containerRef} className={`relative ${className}`}>
          <button
            type="button"
            onClick={() => {
              setIsOpen(!isOpen);
              if (!isOpen) {
                setSearchQuery('');
                setHighlightedIndex(0);
              }
            }}
            onKeyDown={handleKeyDown}
            className="w-full border border-slate-300 rounded px-2 py-1.5 text-xs font-semibold text-slate-800 bg-white flex items-center justify-between gap-1 text-left shadow-sm hover:border-brand-400 focus:ring-2 focus:ring-brand-500 transition"
          >
            <span className="truncate">
              {selectedOption ? selectedOption.name : <span className="text-slate-400 font-normal">{placeholder}</span>}
            </span>
            <span className="text-[9px] text-slate-400 ml-1">▼</span>
          </button>

          {isOpen && (
            <div className="absolute z-50 left-0 top-full mt-1 min-w-[180px] w-full bg-white border border-slate-300 rounded-xl shadow-xl p-1.5 space-y-1 text-xs">
              <div className="relative">
                <input
                  type="text"
                  autoFocus
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  onKeyDown={handleKeyDown}
                  placeholder="Type letter to search..."
                  className="w-full border border-brand-300 rounded-lg px-2.5 py-1 text-xs font-bold text-slate-900 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none"
                />
                {searchQuery && (
                  <button
                    type="button"
                    onClick={() => setSearchQuery('')}
                    className="absolute right-2 top-1 text-slate-400 hover:text-slate-600 font-bold text-xs"
                  >
                    ✕
                  </button>
                )}
              </div>

              <div className="max-h-40 overflow-y-auto space-y-0.5 pt-0.5 scrollbar-thin">
                <button
                  type="button"
                  onClick={() => {
                    onChange('');
                    setIsOpen(false);
                    setSearchQuery('');
                  }}
                  className="w-full text-left px-2 py-1 rounded-md text-xs font-semibold text-slate-400 hover:bg-slate-100 transition"
                >
                  {placeholder}
                </button>

                {filteredOptions.length === 0 ? (
                  <div className="px-2 py-2 text-[11px] text-slate-400 italic text-center">
                    No matches found
                  </div>
                ) : (
                  filteredOptions.map((opt, idx) => {
                    const isSelected = opt.id === value;
                    const isHighlighted = idx === highlightedIndex;

                    return (
                      <button
                        key={opt.id}
                        ref={el => (optionRefs.current[idx] = el)}
                        type="button"
                        onMouseEnter={() => setHighlightedIndex(idx)}
                        onClick={() => handleSelectOption(opt)}
                        className={`w-full text-left px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center justify-between ${
                          isHighlighted
                            ? 'bg-brand-600 text-white shadow-sm ring-1 ring-brand-400'
                            : isSelected
                            ? 'bg-brand-100 text-brand-900'
                            : 'text-slate-800 hover:bg-brand-50 hover:text-brand-900'
                        }`}
                      >
                        <span className="truncate">{opt.name}</span>
                        {(isSelected || isHighlighted) && <span className="text-[10px] ml-1">{isSelected ? '✓' : '↵'}</span>}
                      </button>
                    );
                  })
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* =========================================================================
       ADMIN MANUAL TIMETABLE MANAGER GRID (Department -> Class -> Subject -> Teacher Filtering)
       ========================================================================= */
    function AdminTimetableManager({ currentInstitution, fetchAdminInstitutionData, pushToast, token }) {
      const departments = currentInstitution.departments || [];
      const classes = currentInstitution.classes || [];
      const subjects = currentInstitution.subjects || [];
      const teachers = currentInstitution.teachers || [];
      const periods = (currentInstitution.periods && currentInstitution.periods.length > 0)
        ? currentInstitution.periods
        : [
            { id: 'p1', label: 'Period 1', start: '09:00', end: '09:50', isBreak: false },
            { id: 'p2', label: 'Period 2', start: '09:50', end: '10:40', isBreak: false },
            { id: 'b1', label: 'Break', start: '10:40', end: '10:55', isBreak: true },
            { id: 'p3', label: 'Period 3', start: '10:55', end: '11:45', isBreak: false },
            { id: 'p4', label: 'Period 4', start: '11:45', end: '12:35', isBreak: false },
            { id: 'lunch', label: 'Lunch Break', start: '12:35', end: '13:20', isBreak: true, isLunch: true },
            { id: 'p5', label: 'Period 5', start: '13:20', end: '14:10', isBreak: false },
            { id: 'p6', label: 'Period 6', start: '14:10', end: '15:00', isBreak: false },
            { id: 'p7', label: 'Period 7', start: '15:00', end: '15:50', isBreak: false }
          ];

      const activeWorkingDays = (currentInstitution.settings && currentInstitution.settings.workingDays) || DEFAULT_WORKING_DAYS;

      const [selectedDeptId, setSelectedDeptId] = useState(() => (departments[0] ? departments[0].id : ''));
      const [selectedClassId, setSelectedClassId] = useState('');
      const [mobileActiveDay, setMobileActiveDay] = useState('mon');

      const [draftTimetable, setDraftTimetable] = useState(() => currentInstitution.timetable || {});
      const [isSaving, setIsSaving] = useState(false);
      const [draggedCell, setDraggedCell] = useState(null);

      useEffect(() => {
        if (!selectedDeptId && departments.length > 0) {
          setSelectedDeptId(departments[0].id);
        }
      }, [departments]);

      const availableClasses = classes.filter(c => !selectedDeptId || c.departmentId === selectedDeptId);

      useEffect(() => {
        if (availableClasses.length > 0) {
          const exists = availableClasses.some(c => c.id === selectedClassId);
          if (!exists) {
            setSelectedClassId(availableClasses[0].id);
          }
        } else {
          setSelectedClassId('');
        }
      }, [selectedDeptId, classes]);

      const selectedClassObj = classes.find(c => c.id === selectedClassId);
      const activeDeptId = selectedDeptId || (selectedClassObj && selectedClassObj.departmentId);

      const filteredSubjects = subjects.filter(s => {
        if (activeDeptId && s.departmentId && s.departmentId !== activeDeptId) return false;
        if (selectedClassId && s.classId && s.classId !== selectedClassId) return false;
        return true;
      });

      // Filtered Teachers for Active Department (Supports Multi-Department Teachers)
      const filteredTeachers = teachers.filter(t => {
        const tDepts = Array.isArray(t.departmentIds) && t.departmentIds.length > 0
          ? t.departmentIds
          : (t.departmentId ? [t.departmentId] : []);
        if (activeDeptId && tDepts.length > 0 && !tDepts.includes(activeDeptId)) return false;
        return true;
      });

      // Assign cell values manually
      function handleAssignCell(day, periodId, subjectId, teacherId) {
        setDraftTimetable(prev => {
          const dayList = Array.isArray(prev[day]) ? prev[day] : [];
          const filtered = dayList.filter(e => !(e.periodId === periodId && e.classId === selectedClassId));
          if (!subjectId) return { ...prev, [day]: filtered };
          return {
            ...prev,
            [day]: [...filtered, { periodId, departmentId: activeDeptId, classId: selectedClassId, subjectId, teacherId: teacherId || '' }]
          };
        });
      }

      function handleDragStart(e, day, periodId, entry) {
        if (!entry || !entry.subjectId) return;
        setDraggedCell({ day, periodId, ...entry });
        if (e.dataTransfer) {
          e.dataTransfer.setData('text/plain', JSON.stringify(entry));
        }
      }

      function handleDragOver(e) {
        e.preventDefault();
        if (e.dataTransfer) {
          e.dataTransfer.dropEffect = 'copy';
        }
      }

      function handleDrop(e, targetDay, targetPeriodId) {
        e.preventDefault();
        if (!draggedCell || !selectedClassId) return;

        handleAssignCell(targetDay, targetPeriodId, draggedCell.subjectId, draggedCell.teacherId);
        pushToast({ type: 'success', title: 'Entry Copied!', message: 'Subject and Teacher copied to new period slot.' });
        setDraggedCell(null);
      }

      // Check Teacher Schedule Conflict Across Other Classes for the Same Day & Period Slot
      function getTeacherConflict(day, periodId, teacherId, classId) {
        if (!teacherId || !day || !periodId) return null;

        for (const [d, entries] of Object.entries(draftTimetable)) {
          if (d !== day) continue;
          if (!Array.isArray(entries)) continue;
          for (const entry of entries) {
            if (entry.periodId === periodId && entry.teacherId === teacherId && entry.classId !== classId) {
              const otherClass = classes.find(c => c.id === entry.classId);
              return otherClass ? otherClass.name : 'Another Class';
            }
          }
        }
        return null;
      }

      async function handleSaveTimetable() {
        setIsSaving(true);
        try {
          const res = await fetch(getApiUrl('/api/admin/timetable'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ timetable: draftTimetable })
          });

          if (res.ok) {
            await fetchAdminInstitutionData(token);
            pushToast({ type: 'success', title: 'Timetable Saved Successfully!', message: 'Period grid layout saved to database.' });
          } else {
            const data = await res.json();
            pushToast({ type: 'rose', title: 'Validation Error', message: data.error || 'Failed to save timetable.' });
          }
        } catch (err) {
          pushToast({ type: 'rose', title: 'Connection Error', message: 'Could not connect to backend server.' });
        } finally {
          setIsSaving(false);
        }
      }

      // Compute Automatic Timetable Summary grouped strictly by unique (subjectId + '_' + teacherId) for active class
      const summaryRows = useMemo(() => {
        if (!selectedClassId) return [];

        const countsMap = new Map();

        Object.values(draftTimetable).forEach(dayEntries => {
          if (Array.isArray(dayEntries)) {
            dayEntries.forEach(entry => {
              if (entry && entry.classId === selectedClassId && entry.subjectId) {
                const subjId = entry.subjectId;
                const teacherId = entry.teacherId || '';
                const key = `${subjId}_${teacherId}`;

                if (countsMap.has(key)) {
                  countsMap.get(key).count += 1;
                } else {
                  const subjObj = subjects.find(s => s.id === subjId);
                  const teacherObj = teachers.find(t => t.id === teacherId);
                  countsMap.set(key, {
                    subjId,
                    teacherId,
                    subjName: subjObj ? subjObj.name : 'Unknown Subject',
                    teacherName: teacherObj ? teacherObj.name : (teacherId ? 'Unknown Teacher' : 'Unassigned'),
                    count: 1
                  });
                }
              }
            });
          }
        });

        return Array.from(countsMap.values()).sort((a, b) => a.subjName.localeCompare(b.subjName));
      }, [draftTimetable, selectedClassId, subjects, teachers]);

      const [tutorCodeInput, setTutorCodeInput] = useState('');
      const [isSavingTutor, setIsSavingTutor] = useState(false);

      useEffect(() => {
        if (selectedClassObj) {
          setTutorCodeInput(selectedClassObj.tutorTeacherCode || '');
        } else {
          setTutorCodeInput('');
        }
      }, [selectedClassId, currentInstitution]);

      async function handleAssignTutor() {
        if (!selectedClassId || !tutorCodeInput.trim()) {
          pushToast({ type: 'rose', title: 'Input Error', message: 'Please select a class and enter a valid Faculty Teacher Code.' });
          return;
        }

        setIsSavingTutor(true);
        try {
          const res = await fetch(getApiUrl(`/api/admin/classes/${selectedClassId}/tutor`), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ teacherCode: tutorCodeInput.trim() })
          });

          const resData = await res.json();
          if (res.ok && resData.success) {
            pushToast({ type: 'success', title: 'Tutor Assigned!', message: `Faculty assigned as Tutor for ${selectedClassObj ? selectedClassObj.name : 'class'}.` });
            fetchAdminInstitutionData(token);
          } else {
            pushToast({ type: 'rose', title: 'Tutor Assignment Error', message: resData.error || 'Failed to assign tutor.' });
          }
        } catch (e) {
          pushToast({ type: 'rose', title: 'Network Error', message: e.message });
        } finally {
          setIsSavingTutor(false);
        }
      }

      return (
        <SectionCard title="Manual Timetable Editor & Tutor Assignment Grid">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div className="flex flex-col sm:flex-row sm:items-center gap-3 w-full sm:w-auto">
              {departments.length > 0 && (
                <div className="flex flex-col sm:flex-row sm:items-center gap-1.5 w-full sm:w-auto">
                  <span className="text-xs font-bold text-slate-700 uppercase tracking-wider">1. Department:</span>
                  <select
                    value={selectedDeptId}
                    onChange={e => setSelectedDeptId(e.target.value)}
                    className="w-full sm:w-auto border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-extrabold text-brand-700 bg-white focus:ring-2 focus:ring-brand-500 outline-none shadow-sm"
                  >
                    {departments.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                  </select>
                </div>
              )}

              <div className="flex flex-col sm:flex-row sm:items-center gap-1.5 w-full sm:w-auto">
                <span className="text-xs font-bold text-slate-700 uppercase tracking-wider">2. Class:</span>
                <select
                  value={selectedClassId}
                  onChange={e => setSelectedClassId(e.target.value)}
                  className="w-full sm:w-auto border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-extrabold text-brand-700 bg-white focus:ring-2 focus:ring-brand-500 outline-none shadow-sm"
                >
                  {availableClasses.length === 0 ? (
                    <option value="">No classes in selected department</option>
                  ) : (
                    availableClasses.map(c => <option key={c.id} value={c.id}>{c.name}</option>)
                  )}
                </select>
              </div>
            </div>
            <PrimaryButton icon="check" onClick={handleSaveTimetable} disabled={isSaving} className="w-full sm:w-auto">
              {isSaving ? 'Saving...' : 'Save Timetable Grid'}
            </PrimaryButton>
          </div>

          {/* CLASS TUTOR ASSIGNMENT BAR */}
          {selectedClassObj && (
            <div className="p-4 mb-6 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-sm">

            <div className="space-y-3">

                    <div className="space-y-2">
                      <div>

    /* =========================================================================
       ADMIN PERIOD & DAY SETTINGS MANAGER (Configurable Periods & Short Day)
       ========================================================================= */
    function AdminPeriodSettingsManager({ currentInstitution, fetchAdminInstitutionData, pushToast, token }) {
      const settings = currentInstitution.settings || {};
      const [periods, setPeriods] = useState(() => currentInstitution.periods || []);
      const [shortDayEnabled, setShortDayEnabled] = useState(Boolean(settings.shortDayEnabled));
      const [shortDay, setShortDay] = useState(settings.shortDay || 'fri');
      const [shortDayPeriodsCount, setShortDayPeriodsCount] = useState(settings.shortDayPeriodsCount || 5);
      const [isSaving, setIsSaving] = useState(false);

      useEffect(() => {
        setPeriods(currentInstitution.periods || []);
        setShortDayEnabled(Boolean(currentInstitution.settings?.shortDayEnabled));
        setShortDay(currentInstitution.settings?.shortDay || 'fri');
        setShortDayPeriodsCount(currentInstitution.settings?.shortDayPeriodsCount || 5);
      }, [currentInstitution]);

      function handleAddPeriod() {
        const nextNum = periods.filter(p => !p.isBreak).length + 1;
        const newP = {
          id: 'p_' + Date.now().toString(36),
          label: `Period ${nextNum}`,
          start: '09:00',
          end: '09:50',
          isBreak: false,
          isLunch: false
        };
        setPeriods([...periods, newP]);
      }

      function handleAddBreak(isLunch = false) {
        const newB = {
          id: 'b_' + Date.now().toString(36),
          label: isLunch ? 'Lunch Break' : 'Short Break',
          start: isLunch ? '13:00' : '11:00',
          end: isLunch ? '13:45' : '11:15',
          isBreak: true,
          isLunch: Boolean(isLunch)
        };
        setPeriods([...periods, newB]);
      }

      function handleUpdatePeriod(id, field, value) {
        setPeriods(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
      }

      function handleDeletePeriod(id) {
        setPeriods(prev => prev.filter(p => p.id !== id));
      }

      async function handleSaveSettings() {
        setIsSaving(true);
        try {
          const pRes = await fetch(getApiUrl('/api/admin/periods'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ periods })
          });

          const sRes = await fetch(getApiUrl('/api/admin/institution/settings'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
              shortDayEnabled,
              shortDay,
              shortDayPeriodsCount
            })
          });

          if (pRes.ok && sRes.ok) {
            await fetchAdminInstitutionData(token);
            pushToast({ type: 'success', title: 'Settings & Periods Saved!', message: 'Timetable configuration updated.' });
          } else {
            pushToast({ type: 'rose', title: 'Save Failed', message: 'Failed to save settings.' });
          }
        } catch (e) {
          pushToast({ type: 'rose', title: 'Error', message: 'Connection error while saving settings.' });
        } finally {
          setIsSaving(false);
        }
      }

      return (
        <div className="space-y-6">
          <SectionCard
            title="Working Days & Schedule Configuration"
            subtitle="Configure optional Short Day schedule (Monday to Friday standard schedule)."
          >
            <div className="grid sm:grid-cols-2 gap-6">
              <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
                <div>
                  <h4 className="font-extrabold text-slate-900 text-sm">Standard Working Days</h4>
                  <p className="text-xs text-slate-500 mt-0.5">Monday, Tuesday, Wednesday, Thursday, Friday.</p>
                </div>
                <p className="text-xs text-emerald-700 font-bold">
                  ✓ Active Working Days: Monday to Friday
                </p>
              </div>

              <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
                <div className="flex items-center justify-between">
                  <div>
                    <h4 className="font-extrabold text-slate-900 text-sm">Optional Short Day</h4>
                    <p className="text-xs text-slate-500 mt-0.5">Set a specific day with reduced periods.</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShortDayEnabled(s => !s)}
                    className={`px-4 py-1.5 rounded-full text-xs font-extrabold transition border ${shortDayEnabled ? 'bg-brand-600 text-white border-brand-600' : 'bg-slate-200 text-slate-600 border-slate-300'}`}
                  >
                    {shortDayEnabled ? 'SHORT DAY ON' : 'SHORT DAY OFF'}
                  </button>
                </div>

                {shortDayEnabled && (
                  <div className="flex items-center gap-3 pt-1">
                    <div className="flex-1">
                      <label className="block text-[11px] font-bold text-slate-600 mb-1 uppercase">Select Short Day</label>
                      <select
                        value={shortDay}
                        onChange={e => setShortDay(e.target.value)}
                        className="w-full border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 bg-white"
                      >
                        <option value="fri">Friday</option>
                        <option value="wed">Wednesday</option>
                        <option value="thu">Thursday</option>
                        <option value="mon">Monday</option>
                      </select>
                    </div>
                    <div className="flex-1">
                      <label className="block text-[11px] font-bold text-slate-600 mb-1 uppercase">Periods Count</label>
                      <input
                        type="number"
                        min="1"
                        max="10"
                        value={shortDayPeriodsCount}
                        onChange={e => setShortDayPeriodsCount(e.target.value)}
                        className="w-full border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 bg-white"
                      />
                    </div>
                  </div>
                )}
              </div>
            </div>
          </SectionCard>

          <SectionCard
            title={`Configurable Timetable Period Structure (${periods.length} Slots)`}
            subtitle="Add, edit, remove, and reorder periods, breaks, and lunch breaks."
            action={
              <div className="flex gap-2">
                <GhostButton icon="plus" onClick={handleAddPeriod}>+ Add Period</GhostButton>
                <GhostButton onClick={() => handleAddBreak(false)}>+ Add Break</GhostButton>
                <GhostButton onClick={() => handleAddBreak(true)}>+ Add Lunch</GhostButton>
                <PrimaryButton icon="check" onClick={handleSaveSettings} disabled={isSaving}>
                  {isSaving ? 'Saving...' : 'Save Configuration'}
                </PrimaryButton>
              </div>
            }
          >
            <div className="space-y-3">
              {periods.length === 0 ? (
                <p className="text-xs text-slate-400 italic text-center py-6 border border-dashed rounded-2xl">
                  No periods configured. Click "+ Add Period" above to define period timing structure.
                </p>
              ) : (
                periods.map((p, idx) => (
                  <div key={p.id} className={`p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${p.isLunch ? 'bg-amber-50 border-amber-200' : p.isBreak ? 'bg-slate-100 border-slate-200' : 'bg-white border-slate-200'}`}>
                    <div className="flex items-center gap-3 flex-1">
                      <span className="w-7 h-7 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center text-xs font-bold font-mono">
                        {idx + 1}
                      </span>
                      <input
                        type="text"
                        value={p.label}
                        onChange={e => handleUpdatePeriod(p.id, 'label', e.target.value)}
                        className="border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 bg-white flex-1 max-w-xs"
                      />
                      <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${p.isLunch ? 'bg-amber-200 text-amber-900' : p.isBreak ? 'bg-slate-200 text-slate-700' : 'bg-brand-100 text-brand-800'}`}>
                        {p.isLunch ? 'LUNCH BREAK' : p.isBreak ? 'BREAK' : 'CLASS PERIOD'}
                      </span>
                    </div>

                    <div className="flex items-center gap-3">
                      <div className="flex items-center gap-1 text-xs">
                        <span className="text-slate-500 font-medium">Start:</span>
                        <input
                          type="time"
                          value={p.start}
                          onChange={e => handleUpdatePeriod(p.id, 'start', e.target.value)}
                          className="border border-slate-300 rounded-lg px-2 py-1 text-xs font-mono font-bold bg-white"
                        />
                      </div>
                      <div className="flex items-center gap-1 text-xs">
                        <span className="text-slate-500 font-medium">End:</span>
                        <input
                          type="time"
                          value={p.end}
                          onChange={e => handleUpdatePeriod(p.id, 'end', e.target.value)}
                          className="border border-slate-300 rounded-lg px-2 py-1 text-xs font-mono font-bold bg-white"
                        />
                      </div>
                      <button
                        type="button"
                        onClick={() => handleDeletePeriod(p.id)}
                        className="text-rose-500 hover:text-rose-700 p-1.5 rounded-lg hover:bg-rose-50 transition"
                        title="Delete Period"
                      >
                        <Icon name="trash" size={16} />
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </SectionCard>
        </div>
      );
    }

    /* =========================================================================
       ADMIN STAFF CLASS & SUBJECT ASSIGNMENT MANAGER (AUTO-DERIVED READ-ONLY VIEW)
       ========================================================================= */
    function AdminStaffAssignmentsManager({ currentInstitution }) {
      const teachers = currentInstitution.teachers || [];
      const departments = currentInstitution.departments || [];
      const classes = currentInstitution.classes || [];
      const subjects = currentInstitution.subjects || [];
      const timetable = currentInstitution.timetable || {};

      return (
        <div className="space-y-6">
          <SectionCard
            title="Staff Class & Subject Assignments"
            subtitle="Auto-derived summary of faculty department affiliations and active timetable workload."
          >
            <div className="space-y-4">
              {/* Informational Message Banner */}
              <div className="p-4 bg-brand-50 border border-brand-200 rounded-2xl text-xs text-brand-900 flex items-start gap-2.5">
                <Icon name="info" size={18} className="text-brand-600 shrink-0 mt-0.5" />
                <div className="space-y-0.5">
                  <p className="font-extrabold text-sm text-brand-950">Automatically Derived Staff Assignments</p>
                  <p className="text-xs text-brand-800 leading-relaxed">
                    Departments are synced from <strong>Teachers & Mobile Devices</strong>. Classes and Subjects are derived from the saved <strong>Manual Timetable</strong>.
                  </p>
                </div>
              </div>

              {/* Grid / Stack of Faculty Assignment Cards */}
              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                {teachers.length === 0 ? (
                  <div className="col-span-full text-center py-8 text-slate-400 text-xs italic border border-dashed border-slate-200 rounded-2xl">
                    No faculty members added yet. Add teachers in the "Teachers & Mobile Devices" tab first.
                  </div>
                ) : (
                  teachers.map(t => {
                    // Source 1: Departments from Teachers & Mobile Devices (t.departmentIds or t.departmentId)
                    const tDepts = Array.isArray(t.departmentIds) && t.departmentIds.length > 0
                      ? t.departmentIds
                      : (t.departmentId ? [t.departmentId] : []);
                    const deptObjs = tDepts.map(dId => departments.find(d => d.id === dId)).filter(Boolean);

                    // Source 2: Classes & Subjects derived dynamically ONLY from saved Manual Timetable for this exact teacher
                    const teacherTimetableEntries = [];
                    Object.values(timetable).forEach(dayEntries => {
                      if (Array.isArray(dayEntries)) {
                        dayEntries.forEach(entry => {
                          if (entry && (entry.teacherId === t.id || (t.teacherCode && entry.teacherId === t.teacherCode))) {
                            teacherTimetableEntries.push(entry);
                          }
                        });
                      }
                    });

                    // Extract unique Class IDs & Subject IDs from Timetable where teacher is selected
                    const derivedClassIds = [...new Set(teacherTimetableEntries.map(e => e.classId).filter(Boolean))];
                    const derivedSubjIds = [...new Set(teacherTimetableEntries.map(e => e.subjectId).filter(Boolean))];

                    const derivedClasses = [...new Set([...(t.classIds || []), ...derivedClassIds])]
                      .map(cId => classes.find(c => c.id === cId)).filter(Boolean);

                    const derivedSubjects = [...new Set([...(t.subjectIds || []), ...derivedSubjIds])]
                      .map(sId => subjects.find(s => s.id === sId)).filter(Boolean);

                    return (
                      <div key={t.id} className="p-5 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-4 hover:border-brand-300 transition">
                        <div className="flex items-start justify-between gap-2 border-b border-slate-100 pb-3">
                          <div>
                            <h3 className="font-extrabold text-base text-slate-900">{t.name}</h3>
                            <p className="text-xs font-mono text-slate-500 mt-0.5">Code: {t.teacherCode || '------'} • {t.phone || 'No phone'}</p>
                          </div>
                          <span className="px-2.5 py-1 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-full text-[10px] font-extrabold uppercase tracking-wider shrink-0">
                            ✓ Auto-Synced
                          </span>
                        </div>

                        <div className="space-y-3 text-xs">
                          <div>
                            <span className="font-extrabold text-slate-500 uppercase tracking-wider text-[10px] block mb-1">
                              Assigned Departments (Synced from Teachers):
                            </span>
                            <div className="flex flex-wrap gap-1.5">
                              {deptObjs.length === 0 ? (
                                <span className="text-slate-400 italic text-[11px]">No departments assigned in Teachers & Mobile Devices</span>
                              ) : (
                                deptObjs.map(d => (
                                  <span key={d.id} className="px-3 py-1 bg-brand-50 text-brand-700 font-extrabold rounded-full border border-brand-200 text-xs">
                                    🏛️ {d.name}
                                  </span>
                                ))
                              )}
                            </div>
                          </div>

                          <div>
                            <span className="font-extrabold text-slate-500 uppercase tracking-wider text-[10px] block mb-1">
                              Assigned Classes (Derived from Timetable):
                            </span>
                            <div className="flex flex-wrap gap-1.5">
                              {derivedClasses.length === 0 ? (
                                <span className="text-slate-400 italic text-[11px]">No classes assigned in saved timetable yet</span>
                              ) : (
                                derivedClasses.map(c => (
                                  <span key={c.id} className="px-3 py-1 bg-amber-50 text-amber-900 border border-amber-300 rounded-full font-extrabold text-xs">
                                    📚 {c.name}
                                  </span>
                                ))
                              )}
                            </div>
                          </div>

                          <div>
                            <span className="font-extrabold text-slate-500 uppercase tracking-wider text-[10px] block mb-1">
                              Assigned Subjects (Derived from Timetable):
                            </span>
                            <div className="flex flex-wrap gap-1.5">
                              {derivedSubjects.length === 0 ? (
                                <span className="text-slate-400 italic text-[11px]">No subjects assigned in saved timetable yet</span>
                              ) : (
                                derivedSubjects.map(s => (
                                  <span key={s.id} className="px-3 py-1 bg-brand-100 text-brand-950 border border-brand-300 rounded-full font-extrabold text-xs">
                                    📖 {s.name}

            </div>
          </SectionCard>
        </div>

    /* =========================================================================
       ADMIN ANNOUNCEMENTS MANAGER (Department-wise Broadcasts)
       ========================================================================= */
    function AdminAnnouncementsManager({ currentInstitution, fetchAdminInstitutionData, pushToast, token }) {
      const announcements = currentInstitution.announcements || [];
      const departments = currentInstitution.departments || [];

      const [showModal, setShowModal] = useState(false);
      const [editingAnn, setEditingAnn] = useState(null);

      const [title, setTitle] = useState('');
      const [message, setMessage] = useState('');
      const [selectedDeptIds, setSelectedDeptIds] = useState([]);
      const [deptToAdd, setDeptToAdd] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const availableDepartmentsToAdd = departments.filter(d => !selectedDeptIds.includes(d.id));

      function handleOpenAddModal() {
        setEditingAnn(null);
        setTitle('');
        setMessage('');
        setSelectedDeptIds([]);
        setDeptToAdd('');
        setShowModal(true);
      }

      function handleOpenEditModal(ann) {
        setEditingAnn(ann);
        setTitle(ann.title || '');
        setMessage(ann.message || '');
        const depts = ann.targetDepartments || ann.departmentIds || [];
        setSelectedDeptIds(Array.isArray(depts) ? [...depts] : []);
        setDeptToAdd('');
        setShowModal(true);
      }

      function handleAddDeptChip() {
        if (!deptToAdd) return;
        if (selectedDeptIds.includes(deptToAdd)) return;
        setSelectedDeptIds([...selectedDeptIds, deptToAdd]);
        setDeptToAdd('');
      }

      function handleRemoveDeptChip(deptId) {
        setSelectedDeptIds(selectedDeptIds.filter(id => id !== deptId));
      }

      async function handleSaveAnnouncement(e) {
        e.preventDefault();
        if (!title.trim()) {
          pushToast({ type: 'rose', title: 'Validation Error', message: 'Announcement title is required.' });
          return;
        }
        if (!message.trim()) {
          pushToast({ type: 'rose', title: 'Validation Error', message: 'Announcement message is required.' });
          return;
        }
        if (selectedDeptIds.length === 0) {
          pushToast({ type: 'rose', title: 'Validation Error', message: 'Please select at least 1 target department.' });
          return;
        }

        setIsSubmitting(true);
        try {
          const isEdit = Boolean(editingAnn);
          const apiUrl = isEdit ? getApiUrl(`/api/admin/announcements/${editingAnn.id}`) : getApiUrl('/api/admin/announcements');
          const method = isEdit ? 'PUT' : 'POST';

          const res = await fetch(apiUrl, {
            method,
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
              title: title.trim(),
              message: message.trim(),
              targetDepartments: selectedDeptIds,
              departmentIds: selectedDeptIds
            })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            pushToast({ type: 'rose', title: 'Save Error', message: data.error || 'Failed to publish announcement.' });
            setIsSubmitting(false);
            return;
          }

          await fetchAdminInstitutionData(token);
          setShowModal(false);
          setEditingAnn(null);
          pushToast({
            type: 'success',
            title: isEdit ? 'Announcement Updated!' : 'Announcement Published!',
            message: `Notice '${title.trim()}' targeted to ${selectedDeptIds.length} department(s).`
          });
        } catch (err) {
          pushToast({ type: 'rose', title: 'Connection Error', message: 'Unable to reach backend server to save announcement.' });
        } finally {
          setIsSubmitting(false);
        }
      }

      async function handleDeleteAnnouncement(id) {
        try {
          const res = await fetch(getApiUrl(`/api/admin/announcements/${id}`), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (res.ok) {
            await fetchAdminInstitutionData(token);
            pushToast({ type: 'success', title: 'Announcement Removed', message: 'Announcement deleted.' });
          }
        } catch (e) { }
      }

      return (
        <div className="space-y-6">
          <SectionCard
            title="Department-wise Announcement System"
            subtitle="Broadcast target announcements and official notices to faculty members based on department assignments."
            action={<PrimaryButton icon="plus" onClick={handleOpenAddModal}>Create Announcement</PrimaryButton>}
          >
            <div className="space-y-4">
              {announcements.length === 0 ? (
                <div className="text-center py-12 text-slate-400 text-xs italic border border-dashed border-slate-200 rounded-2xl">
                  No announcements published yet. Click "+ Create Announcement" above to broadcast a new notice.
                </div>
              ) : (
                <div className="grid gap-4">
                  {announcements.map(ann => {
                    const depts = ann.targetDepartments || ann.departmentIds || [];
                    const annDepts = depts.map(dId => departments.find(d => d.id === dId)).filter(Boolean);
                    const formattedDate = new Date(ann.createdAt || Date.now()).toLocaleString('en-US', {
                      month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    return (
                      <div key={ann.id} className="p-5 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-3 hover:border-brand-300 transition">
                        <div className="flex items-start justify-between gap-4">
                          <div className="space-y-1">
                            <div className="flex flex-wrap items-center gap-2">
                              <h3 className="font-extrabold text-base text-slate-900">{ann.title}</h3>
                              <span className="text-[11px] font-semibold text-slate-400">
                                🕒 {formattedDate}
                              </span>
                            </div>
                            <div className="flex flex-wrap gap-1.5 pt-1">
                              <span className="text-[11px] font-bold text-slate-500 mr-1 flex items-center">Target Departments:</span>
                              {annDepts.length === 0 ? (
                                <span className="text-slate-400 italic text-xs">All Departments</span>
                              ) : (
                                annDepts.map(d => (
                                  <span key={d.id} className="px-2.5 py-0.5 bg-brand-50 text-brand-700 font-extrabold rounded-full border border-brand-200 text-[11px]">
                                    🏛️ {d.name}
                                  </span>
                                ))
                              )}
                            </div>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            <button
                              onClick={() => handleOpenEditModal(ann)}
                              className="p-1.5 bg-brand-50 text-brand-700 hover:bg-brand-100 rounded-xl text-xs font-bold border border-brand-200 inline-flex items-center transition"
                              title="Edit Announcement"
                            >
                              <Icon name="edit" size={14} />
                            </button>
                            <button
                              onClick={() => handleDeleteAnnouncement(ann.id)}
                              className="p-1.5 text-rose-500 hover:text-rose-700 rounded-xl hover:bg-rose-50 transition"
                              title="Delete Announcement"
                            >
                              <Icon name="trash" size={16} />
                            </button>
                          </div>
                        </div>

                        <div className="text-sm text-slate-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 whitespace-pre-wrap">
                          {ann.message}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </SectionCard>

          {/* CREATE / EDIT ANNOUNCEMENT MODAL */}
          <Modal
            open={showModal}
            onClose={() => { setShowModal(false); setEditingAnn(null); }}
            title={editingAnn ? "Edit Announcement" : "Create New Announcement"}
          >
            <form onSubmit={handleSaveAnnouncement} className="space-y-4 text-sm">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Announcement Title *</label>
                <input
                  type="text"
                  value={title}
                  onChange={e => setTitle(e.target.value)}
                  placeholder="e.g. End Semester Exam Timetable Released"
                  className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-brand-500 outline-none font-semibold"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Announcement Message *</label>
                <textarea
                  value={message}
                  onChange={e => setMessage(e.target.value)}
                  rows={4}
                  placeholder="Write the complete announcement details for the selected departments..."
                  className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-brand-500 outline-none font-semibold resize-y"
                  required
                />
              </div>

              {/* TARGET DEPARTMENTS ASSIGNMENT */}
              <div className="space-y-2">
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                  Target Departments ({selectedDeptIds.length}) *
                </label>

                <div className="flex flex-wrap gap-1.5 p-3 bg-slate-50 border border-slate-200 rounded-xl min-h-[44px] items-center">
                  {selectedDeptIds.length === 0 ? (
                    <span className="text-xs text-rose-500 font-semibold italic">No department assigned yet. Select at least 1 department below.</span>
                  ) : (
                    selectedDeptIds.map(dId => {
                      const dept = departments.find(d => d.id === dId);
                      return (
                        <span key={dId} className="inline-flex items-center gap-1.5 px-2.5 py-1 bg-brand-100 text-brand-950 border border-brand-300 rounded-lg text-xs font-bold shadow-sm">
                          🏛️ {dept ? dept.name : dId}
                          <button
                            type="button"
                            onClick={() => handleRemoveDeptChip(dId)}
                            className="hover:text-rose-700 text-brand-800 font-extrabold"
                            title="Remove Department"
                          >
                            ×
                          </button>
                        </span>
                      );
                    })
                  )}
                </div>

                <div className="flex items-center gap-2 w-full">
                  <select
                    value={deptToAdd}
                    onChange={e => setDeptToAdd(e.target.value)}
                    className="flex-1 min-w-0 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 bg-white truncate outline-none focus:ring-2 focus:ring-brand-500"
                  >
                    <option value="">{selectedDeptIds.length === 0 ? "-- Select Department --" : "-- Select Additional Department --"}</option>
                    {availableDepartmentsToAdd.map(d => (
                      <option key={d.id} value={d.id}>{d.name}</option>
                    ))}
                  </select>
                  <PrimaryButton
                    onClick={handleAddDeptChip}
                    type="button"
                    icon="plus"
                    className="shrink-0 whitespace-nowrap text-xs px-3 py-2"
                  >
                    + Add More Department
                  </PrimaryButton>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-2 border-t border-slate-200">
                <GhostButton onClick={() => { setShowModal(false); setEditingAnn(null); }}>Cancel</GhostButton>
                <PrimaryButton type="submit" disabled={isSubmitting}>
                  {isSubmitting ? 'Saving...' : 'Publish Announcement'}
                </PrimaryButton>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    /* =========================================================================
       ADMIN LEAVE REQUESTS MANAGER
       ========================================================================= */
    function AdminLeaveRequestsManager({ token, pushToast, fetchAdminInstitutionData }) {
      const [leaves, setLeaves] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [filterStatus, setFilterStatus] = useState('All');
      const [actionId, setActionId] = useState(null);

      const fetchLeaves = async () => {
        setIsLoading(true);
        try {
          const res = await fetch(getApiUrl('/api/admin/leaves'), {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setLeaves(data.leaves || []);
          }
        } catch (e) {
          console.error('[Fetch Leaves Error]', e);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchLeaves();
      }, [token]);

      async function handleApprove(leaveId) {
        setActionId(leaveId);
        try {
          const res = await fetch(getApiUrl(`/api/admin/leaves/${leaveId}/approve`), {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            pushToast({ type: 'success', title: 'Leave Approved', message: 'Leave request approved. System generated substitution requirements for affected schedule periods.' });
            fetchLeaves();
            if (fetchAdminInstitutionData) fetchAdminInstitutionData(token);
          } else {
            pushToast({ type: 'rose', title: 'Error', message: data.error || 'Failed to approve leave.' });
          }
        } catch (err) {
          pushToast({ type: 'rose', title: 'Error', message: 'Connection error approving leave.' });
        } finally {
          setActionId(null);
        }
      }

      async function handleReject(leaveId) {
        setActionId(leaveId);
        try {
          const res = await fetch(getApiUrl(`/api/admin/leaves/${leaveId}/reject`), {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            pushToast({ type: 'reminder', title: 'Leave Rejected', message: 'Leave request rejected.' });
            fetchLeaves();
          } else {
            pushToast({ type: 'rose', title: 'Error', message: data.error || 'Failed to reject leave.' });
          }
        } catch (err) {
          pushToast({ type: 'rose', title: 'Error', message: 'Connection error rejecting leave.' });
        } finally {
          setActionId(null);
        }
      }

      const filteredLeaves = leaves.filter(l => {
        if (filterStatus === 'All') return true;
        return l.status === filterStatus;
      });

      return (
        <SectionCard
          title="Teacher Leave Requests"
          subtitle="Review and process faculty leave applications. Approved leaves automatically generate pending substitution requirements for affected periods."
        >
          <div className="space-y-4">
            <div className="flex border-b border-slate-200 gap-2 overflow-x-auto text-xs font-semibold">
              {['All', 'Pending', 'Approved', 'Rejected', 'Cancelled'].map(st => (
                <button
                  key={st}
                  onClick={() => setFilterStatus(st)}
                  className={`pb-2.5 px-3 border-b-2 transition ${filterStatus === st ? 'border-brand-600 text-brand-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                >
                  {st} ({st === 'All' ? leaves.length : leaves.filter(l => l.status === st).length})
                </button>
              ))}
            </div>

            {isLoading ? (
              <div className="py-8 text-center">
                <div className="w-8 h-8 border-4 border-brand-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                <p className="text-xs text-slate-500">Loading leave requests...</p>
              </div>
            ) : filteredLeaves.length === 0 ? (
              <div className="text-center py-10 text-slate-400 text-xs italic border border-dashed border-slate-200 rounded-2xl">
                No leave requests found for filter '{filterStatus}'.
              </div>
            ) : (
              <div className="space-y-3">
                {filteredLeaves.map(leave => {
                  const statusTones = { Pending: 'amber', Approved: 'green', Rejected: 'rose', Cancelled: 'slate' };
                  return (
                    <div key={leave.id} className="p-4 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-3 hover:border-brand-300 transition">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-2">
                        <div>
                          <span className="text-base font-extrabold text-slate-900">{leave.teacherName}</span>
                          <span className="text-xs text-slate-500 font-mono ml-2">ID: {leave.teacherId}</span>
                        </div>
                        <Badge tone={statusTones[leave.status] || 'slate'}>{leave.status}</Badge>
                      </div>

                      <div className="grid sm:grid-cols-3 gap-2 text-xs">
                        <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                          <span className="text-[10px] uppercase font-bold text-slate-400">Date Range</span>
                          <p className="font-bold text-slate-800 mt-0.5">{leave.fromDate} to {leave.toDate}</p>
                        </div>
                        <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                          <span className="text-[10px] uppercase font-bold text-slate-400">Duration Type</span>
                          <p className="font-bold text-brand-700 mt-0.5">
                            {leave.type === 'specific_period' ? `Specific Period (${leave.periodId || 'Selected Period'})` : 'Full Day'}
                          </p>
                        </div>
                        <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                          <span className="text-[10px] uppercase font-bold text-slate-400">Applied On</span>
                          <p className="font-semibold text-slate-700 mt-0.5">
                            {new Date(leave.createdAt).toLocaleDateString()}
                          </p>
                        </div>
                      </div>

                      {leave.reason && (
                        <div className="text-xs text-slate-700 bg-amber-50/50 p-3 rounded-xl border border-amber-100">
                          <span className="font-bold text-amber-900">Reason: </span>
                          <span>{leave.reason}</span>
                        </div>
                      )}

                      {leave.status === 'Pending' && (
                        <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                          <button
                            onClick={() => handleReject(leave.id)}
                            disabled={actionId === leave.id}
                            className="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl text-xs transition border border-rose-200"
                          >
                            Reject
                          </button>
                          <PrimaryButton
                            onClick={() => handleApprove(leave.id)}
                            disabled={actionId === leave.id}
                            icon="check"
                            className="py-1.5 px-4 text-xs font-bold"
                          >
                            {actionId === leave.id ? 'Processing...' : 'Approve Leave'}
                          </PrimaryButton>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </SectionCard>
      );
    }

    /* =========================================================================
       ADMIN SUBSTITUTIONS & CANDIDATE RANKING MANAGER
       ========================================================================= */
    function AdminSubstitutionsManager({ token, pushToast, fetchAdminInstitutionData }) {
      const [activeTab, setActiveTab] = useState('Pending');
      const [substitutions, setSubstitutions] = useState([]);
      const [isLoading, setIsLoading] = useState(true);

      const [selectedSub, setSelectedSub] = useState(null);
      const [candidates, setCandidates] = useState([]);
      const [isLoadingCandidates, setIsLoadingCandidates] = useState(false);
      const [assigningId, setAssigningId] = useState(null);

      const fetchSubstitutions = async () => {
        setIsLoading(true);
        try {
          const res = await fetch(getApiUrl(`/api/admin/substitutions?status=${activeTab}`), {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setSubstitutions(data.substitutions || []);
          }
        } catch (e) {
          console.error('[Fetch Substitutions Error]', e);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchSubstitutions();
        setSelectedSub(null);
        setCandidates([]);
      }, [token, activeTab]);

      const fetchCandidates = async (sub) => {
        setSelectedSub(sub);
        setIsLoadingCandidates(true);
        try {
          const res = await fetch(getApiUrl(`/api/admin/substitutions/${sub.id}/candidates`), {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setCandidates(data.candidates || []);
          }
        } catch (e) {
          pushToast({ type: 'rose', title: 'Error', message: 'Failed to fetch candidate recommendations.' });
        } finally {
          setIsLoadingCandidates(false);
        }
      };

      async function handleAssign(subId, substituteTeacherId) {
        setAssigningId(substituteTeacherId);
        try {
          const res = await fetch(getApiUrl(`/api/admin/substitutions/${subId}/assign`), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ substituteTeacherId })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            pushToast({ type: 'success', title: 'Substitute Assigned!', message: `Substitute teacher '${data.substitution.substituteTeacherName}' assigned for ${data.substitution.className} ${data.substitution.subjectName}.` });
            setSelectedSub(null);
            setCandidates([]);
            fetchSubstitutions();
            if (fetchAdminInstitutionData) fetchAdminInstitutionData(token);
          } else {
            pushToast({ type: 'rose', title: 'Assignment Conflict', message: data.error || 'Failed to assign substitute.' });
          }
        } catch (err) {
          pushToast({ type: 'rose', title: 'Error', message: 'Connection error during assignment.' });
        } finally {
          setAssigningId(null);
        }
      }

      async function handleCancelSub(subId) {
        try {
          const res = await fetch(getApiUrl(`/api/admin/substitutions/${subId}/cancel`), {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            pushToast({ type: 'reminder', title: 'Substitution Cancelled', message: 'Substitution cancelled.' });
            fetchSubstitutions();
          }
        } catch (e) {}
      }

      return (
        <SectionCard
          title="Teacher Substitution Management"
          subtitle="System automatically identifies free teachers and ranks candidates by department match, subject qualification, experience, and recent workload. Select candidate and click Assign."
        >
          <div className="space-y-4">
            <div className="flex border-b border-slate-200 gap-4 text-xs font-bold">
              {[
                { id: 'Pending', label: 'Pending / Unassigned' },
                { id: 'Assigned', label: 'Assigned' },
                { id: 'History', label: 'Substitution History' }
              ].map(tb => (
                <button
                  key={tb.id}
                  onClick={() => setActiveTab(tb.id)}
                  className={`pb-2.5 border-b-2 transition ${activeTab === tb.id ? 'border-brand-600 text-brand-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                >
                  {tb.label}
                </button>
              ))}
            </div>

            {isLoading ? (
              <div className="py-8 text-center">
