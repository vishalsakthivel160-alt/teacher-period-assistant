<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Period Assistant - Secure Multi-Tenant Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81'
            }
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(1100px 560px at 100% -8%, #e0e7ff 0%, rgba(224,231,255,0) 60%), radial-gradient(900px 520px at -10% 0%, #eef2ff 0%, rgba(238,242,255,0) 55%), linear-gradient(180deg, #f8fafc 0%, #f4f5fb 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(#a5b4fc, #818cf8);
      border-radius: 8px;
    }

    .animate-in {
      animation: fadeIn .25s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #print-area,
      #print-area * {
        visibility: visible;
      }

      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }

      .no-print {
        display: none !important;
      }
    }

    /* ===== Premium theme enhancements ===== */
    h1, h2, h3 { letter-spacing: -0.02em; }
    button { transition: all .18s cubic-bezier(.4,0,.2,1); }
    button.bg-brand-600 {
      background-image: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      box-shadow: 0 8px 20px -6px rgba(79,70,229,.55);
      border: 1px solid rgba(255,255,255,.10);
    }
    button.bg-brand-600:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 12px 28px -6px rgba(79,70,229,.62); }
    button.bg-brand-600:active { transform: translateY(0); }
    .shadow-sm { box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 16px 38px -20px rgba(30,27,75,.28) !important; }
    .shadow-lg { box-shadow: 0 10px 30px -10px rgba(30,27,75,.28) !important; }
    .rounded-2xl, .rounded-xl { transition: box-shadow .2s ease, transform .2s ease; }
    .border-slate-200 { border-color: #e6e8f4 !important; }
    .bg-white\/80, .backdrop-blur { -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px); }
    ::selection { background: #6366f1; color: #fff; }
  </style>
</head>

<body class="text-slate-800 antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    if (window.Babel) {
      Babel.registerPreset('react-classic', {
        presets: [
          [Babel.availablePresets['react'], { runtime: 'classic' }],
          [Babel.availablePresets['env'], { modules: false }]
        ]
      });
    }
  </script>

  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect, useRef, useContext, createContext, useMemo } = React;

    /**
     * Dynamic API URL Helper:
     * Resolves backend API server URL even when file.html is opened directly via file:// protocol or custom port.
     */
    function getApiUrl(endpoint) {
      if (!endpoint) return '';
      if (endpoint.startsWith('http://') || endpoint.startsWith('https://')) return endpoint;
      if (window.location.protocol === 'file:' || window.location.origin === 'null' || !window.location.origin || window.location.origin === 'file://') {
        return 'http://localhost:3000' + endpoint;
      }
      return endpoint;
    }

    /* ===== Biometric (WebAuthn Face ID / Fingerprint) helpers ===== */
    const _b64uToBuf = (s) => { s = s.replace(/-/g,'+').replace(/_/g,'/'); const pad = '='.repeat((4 - s.length % 4) % 4); const bin = atob(s + pad); const b = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; };
    const _bufToB64u = (buf) => { let s=''; const bytes = new Uint8Array(buf); for (let i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); };
    async function biometricSupported() { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } }
    async function enrollBiometric(token, code, role, label) {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const userId = crypto.getRandomValues(new Uint8Array(16));
      const cred = await navigator.credentials.create({ publicKey: {
        challenge, rp: { name: 'Teacher Period Assistant', id: location.hostname },
        user: { id: userId, name: label || 'user', displayName: label || 'user' },
        pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
        authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
        timeout: 60000, attestation: 'none'
      }});
      const credentialId = _bufToB64u(cred.rawId);
      const res = await fetch(getApiUrl('/api/auth/biometric/enable'), { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token }, body: JSON.stringify({ credentialId, label: label || '' }) });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Enable failed');
      localStorage.setItem('tpa_bio_' + code + '_' + role, credentialId);
      return credentialId;
    }
    async function assertBiometric(credId) {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const pk = { challenge, timeout: 60000, userVerification: 'required', rpId: location.hostname };
      if (credId) pk.allowCredentials = [{ type:'public-key', id: _b64uToBuf(credId) }];
      const assertion = await navigator.credentials.get({ publicKey: pk });
      return _bufToB64u(assertion.rawId);
    }

    /* Icons */
    function Icon({ name, size = 20, className = "", strokeWidth = 2 }) {
      const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth, strokeLinecap: "round", strokeLinejoin: "round", className };
      switch (name) {
        case 'home': return <svg {...p}><path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9" /></svg>;
        case 'grid': return <svg {...p}><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /></svg>;
        case 'calendar': return <svg {...p}><rect x="3" y="4" width="18" height="17" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="9" x2="21" y2="9" /></svg>;
        case 'clock': return <svg {...p}><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 3" /></svg>;
        case 'users': return <svg {...p}><circle cx="9" cy="8" r="3" /><path d="M2 20c0-3 3-5 7-5s7 2 7 5" /><circle cx="17" cy="9" r="2.3" /><path d="M22 20c0-2.2-2-4-4.5-4.5" /></svg>;
        case 'user': return <svg {...p}><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-6.5 8-6.5s8 2.5 8 6.5" /></svg>;
        case 'bell': return <svg {...p}><path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 6.5H4.5C4.5 14.5 6 13 6 9Z" /><path d="M10 19a2 2 0 0 0 4 0" /></svg>;
        case 'settings': return <svg {...p}><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1Z" /></svg>;
        case 'logout': return <svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="M16 17l5-5-5-5" /><path d="M21 12H9" /></svg>;
        case 'x': return <svg {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
        case 'check': return <svg {...p}><path d="M20 6 9 17l-5-5" /></svg>;
        case 'plus': return <svg {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>;
        case 'trash': return <svg {...p}><polyline points="3 6 5 6 21 6" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0-1 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 6" /></svg>;
        case 'building': return <svg {...p}><rect x="4" y="3" width="16" height="18" rx="1" /><line x1="9" y1="8" x2="9" y2="8" /><line x1="9" y1="12" x2="9" y2="12" /><line x1="9" y1="16" x2="9" y2="16" /><line x1="15" y1="8" x2="15" y2="8" /><line x1="15" y1="12" x2="15" y2="12" /><line x1="15" y1="16" x2="15" y2="16" /></svg>;
        case 'cap': return <svg {...p}><path d="M12 3 2 8l10 5 10-5Z" /><path d="M6 10v6c0 1.5 3 3 6 3s6-1.5 6-3v-6" /></svg>;
        case 'shield': return <svg {...p}><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6Z" /></svg>;
        case 'mobile': return <svg {...p}><rect x="5" y="2" width="14" height="20" rx="2" ry="2" /><line x1="12" y1="18" x2="12.01" y2="18" /></svg>;
        case 'eye': return <svg {...p}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></svg>;
        case 'eyeOff': return <svg {...p}><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" /><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" /><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" /><line x1="2" y1="2" x2="22" y2="22" /></svg>;
        case 'book': return <svg {...p}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></svg>;
        case 'layers': return <svg {...p}><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></svg>;
        case 'copy': return <svg {...p}><rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>;
        case 'alert': return <svg {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>;
        case 'key': return <svg {...p}><circle cx="7.5" cy="15.5" r="4.5" /><path d="m10.7 12.3 8.3-8.3" /><path d="M16 6.5 18 8.5" /><path d="m14 8.5 2 2" /></svg>;
        default: return null;
      }
    }

    function formatClock(date) { return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }); }
    function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    const DAY_LABELS = { mon: 'Monday', tue: 'Tuesday', wed: 'Wednesday', thu: 'Thursday', fri: 'Friday' };
    const DEFAULT_WORKING_DAYS = ['mon', 'tue', 'wed', 'thu', 'fri'];
    const TEACHER_PALETTE = ['#2563eb', '#059669', '#d97706', '#db2777', '#7c3aed', '#0891b2'];

    function useLocalStorageState(key, initial) {
      const [state, setState] = useState(() => {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : (typeof initial === 'function' ? initial() : initial);
        } catch (e) { return typeof initial === 'function' ? initial() : initial; }
      });
      useEffect(() => { try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) { } }, [key, state]);
      return [state, setState];
    }

    function useLiveClock() {
      const [now, setNow] = useState(() => new Date());
      useEffect(() => {
        const id = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(id);
      }, []);
      return now;
    }

    const AppCtx = createContext(null);
    function useApp() { return useContext(AppCtx); }

    function AppProvider({ children }) {
      const [institutions, setInstitutions] = useLocalStorageState('tpa_institutions_v11', {});
      const [session, setSession] = useLocalStorageState('tpa_session_v11', null);
      const [token, setToken] = useLocalStorageState('tpa_token_v11', null);
      const [toasts, setToasts] = useState([]);
      const now = useLiveClock();

      // Fetch public summary of institutions
      const refreshInstitutions = async () => {
        try {
          const res = await fetch(getApiUrl('/api/auth/institutions'));
          const data = await res.json();
          if (data && data.institutions) {
            const instMap = {};
            data.institutions.forEach(inst => {
              instMap[inst.id] = {
                id: inst.id,
                institution_code: inst.institution_code,
                institution_name: inst.institution_name,
                name: inst.name || inst.institution_name || `Institution (${inst.institution_code})`,
                claimed: inst.claimed,
                adminUsername: inst.adminUsername
              };
            });
            setInstitutions(prev => {
              const updated = { ...prev };
              Object.keys(instMap).forEach(id => {
                if (updated[id]) {
                  // Safely merge summary fields over existing institution state without erasing collections
                  updated[id] = {
                    ...updated[id],
                    ...instMap[id]
                  };
                } else {
                  updated[id] = {
                    ...instMap[id],
                    settings: (prev[id] && prev[id].settings) || { notificationTiming: 0, workingDays: DEFAULT_WORKING_DAYS }
                  };
                }
              });
              return updated;
            });
          }
        } catch (e) { }
      };

      // Fetch complete isolated admin data from GET /api/admin/institution using Bearer JWT token
      const fetchAdminInstitutionData = async (jwtToken) => {
        if (!jwtToken) return;
        try {
          const res = await fetch(getApiUrl('/api/admin/institution'), {
            headers: { 'Authorization': 'Bearer ' + jwtToken }
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.institution) {
              setInstitutions(prev => ({
                ...prev,
                [data.institution.id]: {
                  ...(prev[data.institution.id] || {}),
                  ...data.institution,
                  teachers: data.institution.teachers || [],
                  classes: data.institution.classes || [],
                  subjects: data.institution.subjects || [],
                  periods: data.institution.periods || [],
                  timetable: data.institution.timetable || {},
                  students: data.institution.students || [],
                  attendance: data.institution.attendance || [],
                  assignments: data.institution.assignments || []
                }
              }));
            }
          }
        } catch (e) {
          console.error('[Admin Institution Fetch Error]', e);
        }
      };

      // Fetch complete isolated teacher institution data from GET /api/auth/teacher/timetable
      const fetchTeacherInstitutionData = async (jwtToken) => {
        if (!jwtToken) return;
        try {
          const res = await fetch(getApiUrl('/api/auth/teacher/timetable'), {
            headers: { 'Authorization': 'Bearer ' + jwtToken }
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.institution) {
              const inst = data.institution;
              setInstitutions(prev => ({
                ...prev,
                [inst.id]: {
                  ...(prev[inst.id] || {}),
                  ...inst,
                  departments: (inst.departments && inst.departments.length > 0) ? inst.departments : (prev[inst.id]?.departments || []),
                  teachers: (inst.teachers && inst.teachers.length > 0) ? inst.teachers : (prev[inst.id]?.teachers || []),
                  classes: (inst.classes && inst.classes.length > 0) ? inst.classes : (prev[inst.id]?.classes || []),
                  subjects: (inst.subjects && inst.subjects.length > 0) ? inst.subjects : (prev[inst.id]?.subjects || []),
                  periods: (inst.periods && inst.periods.length > 0) ? inst.periods : (prev[inst.id]?.periods || []),
                  timetable: (inst.timetable && Object.keys(inst.timetable).length > 0) ? inst.timetable : (prev[inst.id]?.timetable || {}),
                  students: (inst.students && inst.students.length > 0) ? inst.students : (prev[inst.id]?.students || []),
                  attendance: (inst.attendance && inst.attendance.length > 0) ? inst.attendance : (prev[inst.id]?.attendance || []),
                  assignments: (inst.assignments && inst.assignments.length > 0) ? inst.assignments : (prev[inst.id]?.assignments || [])
                }
              }));
            }
          }
        } catch (e) {
          console.error('[Teacher Institution Fetch Error]', e);
        }
      };

      useEffect(() => {
        refreshInstitutions();
      }, []);

      useEffect(() => {
        if (token && session && session.institutionId) {
          if (session.role === 'admin') {
            fetchAdminInstitutionData(token);
          } else if (session.role === 'teacher') {
            fetchTeacherInstitutionData(token);
          }
        }
      }, [token, session]);

      function updateInstitution(instId, updater) {
        setInstitutions(prev => {
          if (!prev[instId]) return prev;
          const updatedInst = typeof updater === 'function' ? updater(prev[instId]) : { ...prev[instId], ...updater };
          return {
            ...prev,
            [instId]: updatedInst
          };
        });
      }

      function pushToast(toast) {
        const id = uid('toast');
        setToasts(t => [...t, { id, ...toast }]);
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 6000);
      }
      function dismissToast(id) { setToasts(t => t.filter(x => x.id !== id)); }

      function logout() {
        setSession(null);
        setToken(null);
      }

      const currentInstitution = session && session.institutionId ? institutions[session.institutionId] : null;

      const value = {
        institutions, setInstitutions, updateInstitution, refreshInstitutions, fetchAdminInstitutionData,
        session, setSession, token, setToken, logout,
        now, toasts, pushToast, dismissToast,
        currentInstitution,
      };
      return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
    }

    /* Primitives */
    function Badge({ children, tone = 'slate' }) {
      const map = { slate: 'bg-slate-100 text-slate-600', blue: 'bg-blue-50 text-blue-700', green: 'bg-emerald-50 text-emerald-700', amber: 'bg-amber-50 text-amber-700', rose: 'bg-rose-50 text-rose-700' };
      return <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${map[tone] || map.slate}`}>{children}</span>;
    }
    function SectionCard({ title, subtitle, action, children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-6 ${className}`}>
          {(title || action) && (
            <div className="flex items-start justify-between mb-4 gap-3">
              <div>
                {title && <h3 className="font-semibold text-slate-800">{title}</h3>}
                {subtitle && <p className="text-sm text-slate-500 mt-0.5">{subtitle}</p>}
              </div>
              {action}
            </div>
          )}
          {children}
        </div>
      );
    }
    function PrimaryButton({ children, onClick, className = '', type = 'button', icon, disabled = false }) {
      return (
        <button type={type} disabled={disabled} onClick={onClick} className={`inline-flex items-center justify-center gap-1.5 bg-brand-600 text-white font-medium px-4 py-2.5 rounded-xl hover:bg-brand-700 transition text-sm disabled:opacity-50 ${className}`}>
          {icon && <Icon name={icon} size={16} />}{children}
        </button>
      );
    }
    function GhostButton({ children, onClick, className = '', icon, type = 'button' }) {
      return (
        <button type={type} onClick={onClick} className={`inline-flex items-center justify-center gap-1.5 border border-slate-300 text-slate-600 font-medium px-4 py-2 rounded-xl hover:bg-slate-50 transition text-sm ${className}`}>
          {icon && <Icon name={icon} size={16} />}{children}
        </button>
      );
    }
    function Modal({ open, onClose, title, children }) {
      if (!open) return null;
      return (
        <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4 animate-in" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">
              <h3 className="font-semibold text-slate-800">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" size={20} /></button>
            </div>

    /* =========================================================================
       TEACHER CODE DEVICE REGISTRATION MODAL (For Teachers on Mobile Devices)
       ========================================================================= */
    function TeacherCodeRegistrationModal({ open, onClose, pushToast }) {
      const [teacherCode, setTeacherCode] = useState('');
      const [teacherInfo, setTeacherInfo] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [isSuccess, setIsSuccess] = useState(false);

      async function handleVerifyCode(e) {
        e.preventDefault();
        setErrorMsg('');
        const code = teacherCode.trim();
        if (!code || !/^\d{6}$/.test(code)) {
          setErrorMsg('Please enter a valid 6-digit numeric Teacher Code (e.g. 582914).');
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch(getApiUrl(`/api/push/code-info?code=${encodeURIComponent(code)}`));
          const data = await res.json();
          if (!res.ok || !data.success) {
            setErrorMsg(data.error || 'Invalid Teacher Code. Please verify with Administrator.');
            setIsLoading(false);
            return;
          }

          setTeacherInfo(data);
        } catch (err) {
          setErrorMsg('Could not connect to backend server. Please check your network.');
        } finally {
          setIsLoading(false);
        }
      }

      async function handleRegisterDevice() {
        setIsLoading(true);
        try {
          const perm = await Notification.requestPermission();
          if (perm !== 'granted') {
            setErrorMsg('Notification permission is required to receive period reminders.');
            setIsLoading(false);
            return;
          }

          let subscription = {
            endpoint: 'https://fcm.googleapis.com/fcm/send/demo_token_' + Date.now(),
            keys: { p256dh: 'demo_p256dh', auth: 'demo_auth' }
          };

          const res = await fetch(getApiUrl('/api/push/register-code-device'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              teacherCode: teacherCode.trim(),
              subscription,
              deviceName: 'Mobile Phone'
            })
          });

          const data = await res.json();
          if (res.ok) {
            setIsSuccess(true);
            pushToast({ type: 'success', title: 'Device Registered!', message: 'Device registered successfully. Notifications are enabled.' });
          } else {
            setErrorMsg(data.error || 'Failed to register device.');
          }
        } catch (err) {
          setErrorMsg('Error registering device: ' + err.message);
        } finally {
          setIsLoading(false);
        }
      }

      function handleReset() {
        setTeacherCode('');
        setTeacherInfo(null);
        setErrorMsg('');
        setIsSuccess(false);
        onClose();
      }

      return (
        <Modal open={open} onClose={handleReset} title="📱 Teacher Phone Registration (Via Code)">
          <div className="space-y-4 text-sm">
            {isSuccess ? (
              <div className="text-center py-6 space-y-4">
                <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl">✓</div>
                <div>
                  <h3 className="font-extrabold text-slate-900 text-base">Device Registered Successfully!</h3>
                  <p className="text-xs text-emerald-700 font-bold mt-1">Notifications are enabled.</p>
                  <p className="text-xs text-slate-500 mt-1">
                    Your mobile phone is now linked. You will receive period reminders for your assigned classes.
                  </p>
                </div>
                <PrimaryButton icon="check" onClick={handleReset} className="w-full">
                  Done
                </PrimaryButton>
              </div>
            ) : !teacherInfo ? (
              <form onSubmit={handleVerifyCode} className="space-y-4">
                <p className="text-xs text-slate-600">
                  Enter your <strong>6-digit Teacher Code</strong> provided by your Administrator (e.g. 582914).
                </p>

                {errorMsg && (
                  <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800 font-medium">
                    {errorMsg}
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Teacher Code (6-Digit) *</label>
                  <input
                    type="text"
                    maxLength="6"
                    value={teacherCode}
                    onChange={e => setTeacherCode(e.target.value.replace(/\D/g, ''))}
                    placeholder="e.g. 582914"
                    className="w-full font-mono text-center text-2xl font-bold tracking-widest border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-brand-500 outline-none text-slate-800"
                    required
                  />
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <GhostButton onClick={handleReset}>Cancel</GhostButton>
                  <PrimaryButton type="submit" disabled={isLoading}>
                    {isLoading ? 'Verifying...' : 'Verify Teacher Code'}
                  </PrimaryButton>
                </div>
              </form>
            ) : (
              <div className="space-y-4">
                <div className="p-4 bg-brand-50 border border-brand-200 rounded-2xl">
                  <p className="text-xs text-brand-700 font-semibold uppercase tracking-wider">{teacherInfo.institution.name}</p>
                  <p className="text-lg font-extrabold text-slate-900 mt-0.5">{teacherInfo.teacher.name}</p>
                  <p className="text-xs text-slate-500 font-mono mt-0.5">Phone: {teacherInfo.teacher.phone || 'N/A'}</p>
                  <p className="text-xs font-mono text-brand-700 font-bold mt-1">Teacher Code: {teacherInfo.teacher.teacherCode}</p>
                </div>

                {errorMsg && (
                  <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800 font-medium">
                    {errorMsg}
                  </div>
                )}

                <p className="text-xs text-slate-600">
                  Click below to grant notification permission and register this device for period reminders.
                </p>

                <div className="flex justify-end gap-2 pt-2">
                  <GhostButton onClick={() => setTeacherInfo(null)}>Back</GhostButton>
                  <PrimaryButton icon="bell" onClick={handleRegisterDevice} disabled={isLoading}>
                    {isLoading ? 'Registering...' : 'Allow Push Notifications'}
                  </PrimaryButton>
                </div>
              </div>
            )}
          </div>
        </Modal>
      );
    }

    /* =========================================================================
       AUTHENTICATION PORTAL (5-Digit Institution Code Flow + Teacher Phone Reg)
       ========================================================================= */
    function AuthPortalScreen() {
      const { institutions, setInstitutions, setSession, setToken, pushToast } = useApp();
      const instList = Object.values(institutions);

      const [selectedInstId, setSelectedInstId] = useState(() => instList[0] ? instList[0].id : null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [showTeacherCodeModal, setShowTeacherCodeModal] = useState(false);
      const [loginRole, setLoginRole] = useState('admin'); // 'admin' or 'teacher'

      // Add Institution Form State (NO Institution Name asked at creation!)
      const [newCode, setNewCode] = useState('');
      const [newAdminUsername, setNewAdminUsername] = useState('');
      const [newAdminPassword, setNewAdminPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [showNewPassword, setShowNewPassword] = useState(false);
      const [showConfirmPassword, setShowConfirmPassword] = useState(false);

      // Admin Sign In Form State
      const [loginCode, setLoginCode] = useState('');
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [showLoginPassword, setShowLoginPassword] = useState(false);

      // Teacher Sign In Form State
      const [teacherCodeInput, setTeacherCodeInput] = useState('');

      // Student Sign In Form State
      const [studentRegisterNumber, setStudentRegisterNumber] = useState('');

      // Forgot Password Modal State
      const [showForgotModal, setShowForgotModal] = useState(false);
      const [forgotEmail, setForgotEmail] = useState('');
      const [forgotResetUrl, setForgotResetUrl] = useState('');

      const [isLoading, setIsLoading] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');
      const [bioSupported, setBioSupported] = useState(false);
      const [bioEnroll, setBioEnroll] = useState(false);
      const [bioBusy, setBioBusy] = useState(false);
      useEffect(() => { biometricSupported().then(setBioSupported); }, []);

      const currentInst = selectedInstId ? institutions[selectedInstId] : null;

      useEffect(() => {
        if (!selectedInstId && instList.length > 0) {
          setSelectedInstId(instList[0].id);
        }
      }, [instList.length]);

      useEffect(() => {
        if (currentInst) {
          setLoginCode(currentInst.institution_code || '');
        }
        setErrorMessage('');
      }, [selectedInstId]);

      // Action: Add Institution with 5-digit Code
      async function handleCreateInstitutionAndAdmin(e) {
        e.preventDefault();
        setErrorMessage('');

        const cleanCode = newCode.trim();
        if (!/^\d{5}$/.test(cleanCode)) {
          setErrorMessage('Institution Code must be a 5-digit numeric code (e.g. 48271).');
          return;
        }

        if (!newAdminUsername.trim() || !newAdminPassword) {
          setErrorMessage('Please fill in Admin Username and Password.');
          return;
        }

        if (newAdminPassword !== confirmPassword) {
          setErrorMessage('Passwords do not match. Please verify and try again.');
          return;
        }

        if (newAdminPassword.length < 8) {
          setErrorMessage('Password must be at least 8 characters long.');
          return;
        }

        setIsLoading(true);
        try {
          const apiUrl = getApiUrl('/api/auth/create-institution-admin');
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              institution_code: cleanCode,
              username: newAdminUsername.trim(),
              password: newAdminPassword,
              confirmPassword: confirmPassword
            })
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            setErrorMessage(data.error || 'Failed to create institution.');
            setIsLoading(false);
            return;
          }

          setInstitutions(prev => ({
            ...prev,
            [data.institution.id]: data.institution
          }));

          setToken(data.token);
          setSession({
            role: 'admin',
            institutionId: data.institution.id,
            username: data.admin.username
          });

          setShowAddModal(false);
          setNewCode('');
          setNewAdminUsername('');
          setNewAdminPassword('');
          setConfirmPassword('');
          pushToast({ type: 'success', title: 'Institution Created!', message: `Institution registered with Code: ${data.institution.institution_code}.` });
        } catch (err) {
          setErrorMessage(`Unable to connect to backend server at http://localhost:3000 (${err.message}).`);
        } finally {
          setIsLoading(false);
        }
      }

      // Action: Admin Sign-In (institution_id + institution_code + username + password_hash)
      async function handleAdminLogin(e) {
        e.preventDefault();
        setErrorMessage('');

        const cleanCode = loginCode.trim();
        if (!cleanCode || !loginUsername.trim() || !loginPassword) {
          setErrorMessage('Please enter Institution Code, Admin Username, and Password.');
          return;
        }

        setIsLoading(true);
        try {
          const apiUrl = getApiUrl('/api/auth/login');
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              institutionCode: cleanCode,
              username: loginUsername.trim(),
              password: loginPassword
            })
          });

          const data = await res.json();

          if (res.status === 429) {
            setErrorMessage('⚠️ Rate Limit Exceeded: Too many failed attempts. Please wait 15 minutes before trying again.');
            setIsLoading(false);
            return;
          }

          if (!res.ok || !data.success) {
            setErrorMessage(data.error || 'Invalid Institution Code, Username, or Password.');
            setIsLoading(false);
            return;
          }

          setToken(data.token);
          if (bioEnroll) { try { await enrollBiometric(data.token, cleanCode, 'admin', loginUsername.trim()); pushToast({ type: 'success', title: 'Face ID Enabled', message: 'You can now sign in with biometrics on this device.' }); } catch (bioErr) {} }
          setSession({
            role: 'admin',
            institutionId: data.institutionId,
            username: data.admin.username
          });

          pushToast({ type: 'success', title: 'Login Successful', message: `Welcome back to Admin Dashboard!` });
        } catch (err) {
          setErrorMessage(`Unable to connect to backend server at http://localhost:3000 (${err.message}).`);
        } finally {
          setIsLoading(false);
        }
      }

      // Action: Teacher Sign-In (institution_code + 6-digit teacherCode)
      async function handleTeacherLogin(e) {
        e.preventDefault();
        setErrorMessage('');

        const cleanInstCode = loginCode.trim();
        const cleanTeacherCode = teacherCodeInput.trim();

        if (!cleanInstCode || !cleanTeacherCode) {
          setErrorMessage('Please enter 5-Digit Institution Code and 6-Digit Teacher Code.');
          return;
        }

        setIsLoading(true);
        try {
          const apiUrl = getApiUrl('/api/auth/teacher-login');
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              institutionCode: cleanInstCode,
              teacherCode: cleanTeacherCode
            })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            setErrorMessage(data.error || 'Invalid Teacher Code or Institution Code.');
            setIsLoading(false);
            return;
          }

          setToken(data.token);
          if (bioEnroll) { try { await enrollBiometric(data.token, cleanInstCode, 'teacher', data.teacher.name); pushToast({ type: 'success', title: 'Face ID Enabled', message: 'Biometric sign-in is now active on this device.' }); } catch (bioErr) {} }
          setSession({
            role: 'teacher',
            institutionId: data.institutionId,
            teacherId: data.teacher.id,
            username: data.teacher.name,
            teacherCode: data.teacher.teacherCode,
            phone: data.teacher.phone,
            institutionName: data.institutionName
          });

          pushToast({ type: 'success', title: 'Welcome!', message: `Signed in as ${data.teacher.name}.` });
        } catch (err) {
          setErrorMessage(`Unable to connect to backend server (${err.message}).`);
        } finally {
          setIsLoading(false);
        }
      }

      // Action: Student Sign-In (institution_code + registerNumber)
      async function handleStudentLogin(e) {
        e.preventDefault();
        setErrorMessage('');

        const cleanInstCode = loginCode.trim();
        const cleanReg = studentRegisterNumber.trim();

        if (!cleanInstCode || !cleanReg) {
          setErrorMessage('Please enter 5-Digit Institution Code and Register Number.');
          return;
        }

        setIsLoading(true);
        try {
          const apiUrl = getApiUrl('/api/auth/student-login');
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              institutionCode: cleanInstCode,
              registerNumber: cleanReg
            })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            setErrorMessage(data.error || 'Student not found. Please check Register Number.');
            setIsLoading(false);
            return;
          }

          setToken(data.token);
          setSession({
            role: 'student',
            institutionId: data.institution.id,
            studentId: data.student.id,
            registerNumber: data.student.registerNumber,
            username: data.student.name,
            institutionName: data.institution.name
          });

          pushToast({ type: 'success', title: 'Welcome!', message: `Signed in as Student ${data.student.name}.` });
        } catch (err) {
          setErrorMessage(`Unable to connect to backend server (${err.message}).`);
        } finally {
          setIsLoading(false);
        }
      }

      async function handleBiometricLogin(role) {
        setErrorMessage('');
        const code = (currentInst && currentInst.institution_code) || loginCode.trim();
        const credId = localStorage.getItem('tpa_bio_' + code + '_' + role);
        if (!credId) { setErrorMessage('No Face ID / Fingerprint is set up for this ' + role + ' on this device yet. Sign in once with your credentials and tick "Enable Face ID".'); return; }
        setBioBusy(true);
        try {
          await assertBiometric(credId);
          const res = await fetch(getApiUrl('/api/auth/biometric/login'), { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ credentialId: credId }) });
          const data = await res.json();
          if (!res.ok || !data.success) { setErrorMessage(data.error || 'Biometric sign-in failed.'); setBioBusy(false); return; }
          setToken(data.token);
          if (data.role === 'teacher') {
            setSession({ role: 'teacher', institutionId: data.institutionId, teacherId: data.teacher.id, username: data.teacher.name, teacherCode: data.teacher.teacherCode, phone: data.teacher.phone, institutionName: data.institutionName });
          } else if (data.role === 'student') {
            setSession({ role: 'student', institutionId: data.institutionId, studentId: data.student.id, registerNumber: data.student.registerNumber, username: data.student.name, institutionName: data.institution.name });
          } else {
            setSession({ role: 'admin', institutionId: data.institutionId, username: data.username });
          }
          pushToast({ type: 'success', title: 'Signed in', message: 'Unlocked with biometrics.' });
        } catch (e) {
          setErrorMessage('Biometric verification was cancelled or failed.');
        } finally { setBioBusy(false); }
      }

      // Action: Forgot Password Request
      async function handleForgotPassword(e) {
        e.preventDefault();
        if (!forgotEmail.trim() || !loginCode.trim()) return;

        try {
          const res = await fetch(getApiUrl('/api/auth/forgot-password'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ institutionCode: loginCode.trim(), recoveryEmail: forgotEmail.trim() })
          });
          const data = await res.json();

          if (data.resetUrl) {
            setForgotResetUrl(data.resetUrl);
          } else {
            pushToast({ type: 'reminder', title: 'Password Reset Request Sent', message: 'If the recovery email matches, a reset link was generated.' });
          }
        } catch (e) {
          setForgotResetUrl(`${window.location.origin}/reset-password.html?token=demo_token`);
        }
      }

      return (
        <div className="min-h-screen w-full flex items-stretch justify-center sm:p-4 lg:p-6">
          <div className="w-full max-w-5xl bg-white sm:rounded-3xl border border-slate-200 shadow-2xl overflow-hidden animate-in grid lg:grid-cols-[1.05fr,1fr] lg:min-h-[660px]">
            {/* LEFT BRAND PANEL */}
            <div className="hidden lg:flex flex-col justify-between relative p-10 text-white bg-gradient-to-br from-brand-600 via-brand-700 to-brand-900 overflow-hidden">
              <div className="absolute -top-16 -right-16 w-64 h-64 rounded-full bg-white/10 blur-2xl"></div>
              <div className="absolute -bottom-24 -left-12 w-72 h-72 rounded-full bg-brand-400/20 blur-3xl"></div>
              <div className="relative">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-white/15 backdrop-blur flex items-center justify-center text-2xl border border-white/20">🎓</div>
                  <div>
                    <p className="font-extrabold text-lg leading-tight">Teacher Period</p>
                    <p className="text-brand-100 text-xs -mt-0.5">Assistant Suite</p>
                  </div>
                </div>
                <h2 className="mt-10 text-3xl font-extrabold leading-tight">Run your institution<br/>with confidence.</h2>
                <p className="mt-3 text-brand-100 text-sm max-w-xs">One secure portal for timetables, faculty, attendance and student records — saved safely in the cloud.</p>
                <div className="mt-8 space-y-3">
                  <div className="flex items-center gap-3 text-sm"><div className="w-7 h-7 rounded-lg bg-white/15 flex items-center justify-center">🗓️</div><span className="text-brand-50">Smart timetable &amp; substitutions</span></div>
                  <div className="flex items-center gap-3 text-sm"><div className="w-7 h-7 rounded-lg bg-white/15 flex items-center justify-center">👩‍🏫</div><span className="text-brand-50">Faculty &amp; student management</span></div>
                  <div className="flex items-center gap-3 text-sm"><div className="w-7 h-7 rounded-lg bg-white/15 flex items-center justify-center">🔐</div><span className="text-brand-50">Face ID / Fingerprint sign-in</span></div>
                </div>
              </div>
              <div className="relative flex items-center gap-2 text-brand-100 text-xs">
                <span className="px-2.5 py-1 rounded-full bg-white/10 border border-white/20">🔒 Encrypted</span>
                <span className="px-2.5 py-1 rounded-full bg-white/10 border border-white/20">☁️ Cloud-saved</span>
              </div>
            </div>
            {/* RIGHT COLUMN */}
            <div className="flex flex-col min-w-0 overflow-y-auto">
            {/* Header Banner */}
            <div className="bg-gradient-to-r from-brand-600 to-brand-800 text-white p-6 sm:p-8 text-center relative lg:hidden">
              <div className="w-14 h-14 bg-white/10 backdrop-blur rounded-2xl mx-auto flex items-center justify-center mb-3 text-3xl">
                🛡️
              </div>
              <h2 className="text-2xl font-extrabold">Teacher Assistant Portal</h2>

                >

    /* =========================================================================
       POST-LOGIN INSTITUTION NAME SETUP BANNER / MODAL (In Admin Dashboard)
       ========================================================================= */
    function PostLoginInstitutionNameSetup({ currentInstitution, updateInstitution, pushToast, token }) {
      const [instNameInput, setInstNameInput] = useState(currentInstitution.institution_name || '');
      const [isSaving, setIsSaving] = useState(false);
      const [error, setError] = useState('');

      const hasName = Boolean(currentInstitution.institution_name && currentInstitution.institution_name.trim());

      async function handleSaveName(e) {
        e.preventDefault();
        setError('');
        if (!instNameInput.trim()) {
          setError('Please enter your School / College / Institution Name.');
          return;
        }

        setIsSaving(true);
        try {
          const apiUrl = getApiUrl('/api/admin/institution-name');
          const res = await fetch(apiUrl, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ name: instNameInput.trim() })
          });

          const data = await res.json();
          if (!res.ok) {
            setError(data.error || 'Failed to save institution name.');
            setIsSaving(false);
            return;
          }

          if (updateInstitution && currentInstitution) {
            updateInstitution(currentInstitution.id, inst => ({
              ...inst,
              institution_name: data.institutionName,
              name: data.institutionName
            }));
          }

          if (fetchAdminInstitutionData) await fetchAdminInstitutionData(token);
          if (refreshInstitutions) await refreshInstitutions();

          pushToast({ type: 'success', title: 'Institution Name Saved!', message: `Set to: ${data.institutionName}` });
        } catch (err) {
          console.error('[Save Institution Name Error]', err);
          setError('Connection error saving institution name.');
        } finally {
          setIsSaving(false);
        }
      }

      if (hasName) return null;

      return (
        <div className="bg-amber-50 border-2 border-amber-300 rounded-3xl p-6 shadow-md animate-in mb-6">
          <div className="flex items-start gap-4">
            <div className="w-12 h-12 rounded-2xl bg-amber-500 text-white flex items-center justify-center text-2xl flex-shrink-0">
              🏛️
            </div>
            <div className="flex-1">
              <h3 className="text-lg font-extrabold text-amber-950">Set Institution Name</h3>
              <p className="text-xs text-amber-800 mt-0.5">
                Welcome! Please enter your School / College / Institution Name to complete your profile.
              </p>

              {error && <p className="text-xs font-semibold text-rose-700 mt-2">{error}</p>}

              <form onSubmit={handleSaveName} className="mt-4 flex flex-col sm:flex-row gap-3">
                <input
                  type="text"
                  value={instNameInput}
                  onChange={e => setInstNameInput(e.target.value)}
                  placeholder="e.g. ABC Engineering College"
                  className="flex-1 border border-amber-300 rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-800 bg-white focus:ring-2 focus:ring-amber-500 outline-none"
                  required
                />
                <PrimaryButton type="submit" icon="check" disabled={isSaving} className="bg-amber-600 hover:bg-amber-700 py-2.5 px-6 font-bold">
                  {isSaving ? 'Saving...' : 'Save Institution Name'}
                </PrimaryButton>
              </form>
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================================

       ========================================================================= */
    function AdminSectionsSubjectsManager({ currentInstitution, fetchAdminInstitutionData, pushToast, token }) {
      const departments = currentInstitution.departments || [];
      const classes = currentInstitution.classes || [];
      const subjects = currentInstitution.subjects || [];

      const [newDeptName, setNewDeptName] = useState('');
      const [newClassName, setNewClassName] = useState('');
      const [newSubjName, setNewSubjName] = useState('');
      const [selectedDeptId, setSelectedDeptId] = useState(() => (departments[0] ? departments[0].id : ''));
      const [subjDeptId, setSubjDeptId] = useState(() => (departments[0] ? departments[0].id : ''));
      const [subjClassId, setSubjClassId] = useState('');

      const [isAddingDept, setIsAddingDept] = useState(false);
      const [isAddingClass, setIsAddingClass] = useState(false);
      const [isAddingSubj, setIsAddingSubj] = useState(false);

      // Available classes for subject creation filtered by selected subject department
      const subjAvailableClasses = classes.filter(c => !subjDeptId || c.departmentId === subjDeptId);

      useEffect(() => {
        if (!selectedDeptId && departments.length > 0) setSelectedDeptId(departments[0].id);
        if (!subjDeptId && departments.length > 0) setSubjDeptId(departments[0].id);
      }, [departments]);

      async function handleAddDepartment(e) {
        e.preventDefault();
        if (!newDeptName.trim()) return;

        setIsAddingDept(true);
        try {
          const res = await fetch(getApiUrl('/api/admin/departments'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ name: newDeptName.trim() })
          });
          const data = await res.json();
          if (res.ok) {
            await fetchAdminInstitutionData(token);
            setNewDeptName('');
            pushToast({ type: 'success', title: 'Department Added', message: `Department '${data.department.name}' created.` });
          } else {
            pushToast({ type: 'rose', title: 'Error', message: data.error || 'Failed to add department.' });
          }
        } catch (err) {
          pushToast({ type: 'rose', title: 'Error', message: 'Connection error.' });
        } finally {
          setIsAddingDept(false);
        }
      }

      async function handleDeleteDepartment(id) {
        try {
          const res = await fetch(getApiUrl(`/api/admin/departments/${id}`), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (res.ok) {
            await fetchAdminInstitutionData(token);
            pushToast({ type: 'success', title: 'Department Deleted', message: 'Department removed.' });
          }
        } catch (err) { }
      }

      async function handleAddClass(e) {
        e.preventDefault();
        if (!newClassName.trim()) return;
        if (departments.length > 0 && !selectedDeptId) {

                      required

                    <label className="block text-[11px] font-bold text-slate-700 mb-1 uppercase tracking-wider">2. Select Class (Optional)</label>

    /* =========================================================================
       ADMIN TEACHER & MOBILE DEVICE MANAGER (Multi-Department Support)
       ========================================================================= */
    function AdminTeacherDevicesManager({ currentInstitution, fetchAdminInstitutionData, pushToast, token }) {
      const teachers = currentInstitution.teachers || [];
      const departments = currentInstitution.departments || [];
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingTeacher, setEditingTeacher] = useState(null);

      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [selectedDeptIds, setSelectedDeptIds] = useState([]);
      const [deptToAdd, setDeptToAdd] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [activeRegLinkModal, setActiveRegLinkModal] = useState(null);

      const availableDepartmentsToAdd = departments.filter(d => !selectedDeptIds.includes(d.id));

      function handleOpenAddModal() {
        setName('');
        setPhone('');
        setSelectedDeptIds([]);
        setDeptToAdd('');
        setShowAddModal(true);
      }

      function handleOpenEditModal(teacher) {
        setEditingTeacher(teacher);
        setName(teacher.name || '');
        setPhone(teacher.phone || '');
        const tDepts = Array.isArray(teacher.departmentIds) && teacher.departmentIds.length > 0
          ? [...teacher.departmentIds]
          : (teacher.departmentId ? [teacher.departmentId] : []);
        setSelectedDeptIds(tDepts);
        setDeptToAdd('');
      }

      function handleAddDeptChip() {
        if (!deptToAdd) return;
        if (selectedDeptIds.includes(deptToAdd)) {
          pushToast({ type: 'amber', title: 'Already Added', message: 'Department is already in the list.' });
          return;
        }
        setSelectedDeptIds([...selectedDeptIds, deptToAdd]);
        setDeptToAdd('');
      }

      function handleRemoveDeptChip(deptId) {
        setSelectedDeptIds(selectedDeptIds.filter(id => id !== deptId));
      }

      async function handleSaveTeacher(e) {
        e.preventDefault();
        if (!name.trim()) return;

        setIsSubmitting(true);
        try {
          const isEdit = Boolean(editingTeacher);
          const apiUrl = isEdit ? getApiUrl(`/api/admin/teachers/${editingTeacher.id}`) : getApiUrl('/api/admin/teachers');
          const method = isEdit ? 'PUT' : 'POST';

          const res = await fetch(apiUrl, {
            method,
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
              name: name.trim(),
              phone: phone.trim() || '+91 98765 00000',
              departmentIds: selectedDeptIds,
              departmentId: selectedDeptIds[0] || ''
            })
          });

          const data = await res.json();

          if (!res.ok) {
            pushToast({ type: 'rose', title: 'Error Saving Teacher', message: data.error || 'Failed to save teacher.' });
            setIsSubmitting(false);
            return;
          }

          await fetchAdminInstitutionData(token);
          setShowAddModal(false);
          setEditingTeacher(null);
          pushToast({ type: 'success', title: 'Teacher Saved!', message: `${data.teacher.name} updated successfully.` });
        } catch (err) {
          pushToast({ type: 'rose', title: 'Connection Error', message: 'Unable to reach backend server to save teacher.' });
        } finally {
          setIsSubmitting(false);
        }
      }

      async function handleDeleteTeacher(id) {
        try {
          const res = await fetch(getApiUrl(`/api/admin/teachers/${id}`), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });

          if (res.ok) {
            await fetchAdminInstitutionData(token);
            pushToast({ type: 'success', title: 'Teacher Removed', message: 'Teacher deleted from database.' });
          }
        } catch (e) { }
      }

      async function handleDeleteDevice(deviceId) {
        try {
          const res = await fetch(getApiUrl(`/api/admin/devices/${deviceId}`), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (res.ok) {
            await fetchAdminInstitutionData(token);
            pushToast({ type: 'success', title: 'Device Unregistered', message: 'Mobile device token removed.' });
          }
        } catch (e) { }
      }

      async function handleSendTestNotification(teacherId) {
        try {
          const res = await fetch(getApiUrl('/api/push/test-notification'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ teacherId })
          });
          const data = await res.json();
          if (res.ok) {
            pushToast({ type: 'success', title: 'Test Notification Dispatched', message: data.message || 'Push notification sent.' });
          } else {
            pushToast({ type: 'rose', title: 'Notification Warning', message: data.error || 'No registered devices found for teacher.' });
          }
        } catch (err) {
          pushToast({ type: 'rose', title: 'Connection Error', message: 'Unable to reach notification service.' });
        }
      }

      async function generateDeviceLink(teacher) {
        try {
          const res = await fetch(getApiUrl(`/api/admin/teachers/${teacher.id}/registration-link`), {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (res.ok) {
            const data = await res.json();
            setActiveRegLinkModal({ teacher, url: data.registrationUrl });
          } else {
            setActiveRegLinkModal({ teacher, url: `${window.location.origin}/register-device.html?token=demo_token_${teacher.id}&code=${teacher.teacherCode}` });
          }
        } catch (e) {
          setActiveRegLinkModal({ teacher, url: `${window.location.origin}/register-device.html?token=demo_token_${teacher.id}&code=${teacher.teacherCode}` });
        }
      }

          <SectionCard
            title="Faculty & Mobile Push Notification Device Registry"
            subtitle="Manage teachers, phone numbers, 6-digit Teacher Codes, multiple department assignments, and mobile device registrations."

          >

              {teachers.length === 0 ? (
                <div className="text-center py-8 text-slate-400 text-xs italic border border-dashed border-slate-200 rounded-2xl">
                  No teachers added yet. Click "+ Add New Teacher" above.
                </div>
              ) : (
                teachers.map(t => {
                  const regDevs = t.registeredDevices || [];
                  const tDepts = Array.isArray(t.departmentIds) && t.departmentIds.length > 0
                    ? t.departmentIds
                    : (t.departmentId ? [t.departmentId] : []);
                  const deptObjs = tDepts.map(dId => departments.find(d => d.id === dId)).filter(Boolean);

                  return (
                    <div key={t.id} className="p-4 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-3 hover:border-brand-300 transition">
                      <div className="flex items-start justify-between gap-2 border-b border-slate-100 pb-2">
                        <div>
                          <h3 className="font-extrabold text-base text-slate-900">{t.name}</h3>
                          <p className="text-xs font-mono text-slate-500 mt-0.5">{t.phone || 'No phone'}</p>
                        </div>
                        <span className="px-2.5 py-1 bg-amber-50 text-amber-900 border border-amber-300 rounded-lg text-xs font-mono font-bold tracking-wider inline-flex items-center gap-1 shrink-0">
                          <Icon name="key" size={12} className="text-amber-700" /> {t.teacherCode || '------'}
                        </span>
                      </div>

                      <div className="space-y-2 text-xs">
                        <div>
                          <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Assigned Departments:</span>
                          <div className="flex flex-wrap gap-1 mt-1">
                            {deptObjs.length === 0 ? (
                              <span className="text-slate-400 italic">General / All</span>
                            ) : (
                              deptObjs.map(d => (
                                <span key={d.id} className="px-2.5 py-0.5 bg-brand-50 text-brand-700 font-extrabold rounded-full border border-brand-200 text-[11px]">
                                  {d.name}
                                </span>
                              ))
                            )}
                          </div>
                        </div>

                        <div>
                          <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Registered Devices:</span>
                          <div className="mt-1 space-y-1">
                            <button
                              type="button"
                              onClick={() => generateDeviceLink(t)}
                              className="px-2.5 py-1 rounded-lg bg-brand-50 border border-brand-200 text-brand-700 hover:bg-brand-100 text-xs font-semibold flex items-center gap-1 transition"
                            >
                              <Icon name="mobile" size={14} /> Get Device Link
                            </button>
                            {regDevs.length > 0 && (
                              <div className="space-y-1 pt-1">
                                {regDevs.map(d => (
                                  <div key={d.id} className="flex items-center justify-between bg-emerald-50 text-emerald-800 px-2.5 py-1 rounded-lg text-[11px] font-mono border border-emerald-200">
                                    <span>📱 {d.deviceName || 'Registered Phone'}</span>
                                    <button onClick={() => handleDeleteDevice(d.id)} className="text-rose-600 hover:text-rose-800 ml-2 font-bold">×</button>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 pt-2 border-t border-slate-100">
                        <button
                          onClick={() => handleOpenEditModal(t)}
                          className="w-full py-2 px-3 rounded-xl bg-brand-50 border border-brand-200 text-brand-700 hover:bg-brand-100 text-xs font-bold flex items-center justify-center gap-1 transition"
                        >
                          <Icon name="edit" size={14} /> Edit
                        </button>
                        <button

                          <Icon name="bell" size={14} /> Test Push

                        <button

                        >
                          <Icon name="trash" size={14} /> Delete
                        </button>
                      </div>
                    </div>
                  );
                })
              )}

                    <th className="px-4 py-3 text-left">Assigned Departments</th>

                    <th className="px-4 py-3 text-left">Teacher Code (6-Digit)</th>

                      const tDepts = Array.isArray(t.departmentIds) && t.departmentIds.length > 0
                        ? t.departmentIds
                        : (t.departmentId ? [t.departmentId] : []);
                      const deptObjs = tDepts.map(dId => departments.find(d => d.id === dId)).filter(Boolean);
